<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Oii Chat 💬</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Poppins,sans-serif;
}

body{
  background:#f2f4f7;
  color:#222;
  overflow:hidden;
}

button{
  border:0;
  outline:0;
  cursor:pointer;
}

input{
  outline:0;
}

.hidden{
  display:none!important;
}

/* LOGIN */

#loginScreen{
  width:100%;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#6c63ff,#8f7cff);
}

.loginBox{
  width:90%;
  max-width:380px;
  background:#fff;
  border-radius:24px;
  padding:35px 25px;
  text-align:center;
  box-shadow:0 15px 45px rgba(0,0,0,.18);
}

.logo{
  font-size:38px;
  font-weight:700;
  margin-bottom:8px;
}

.loginBox p{
  color:#777;
  font-size:14px;
  margin-bottom:25px;
}

.googleBtn{
  width:100%;
  padding:14px;
  border-radius:12px;
  background:#fff;
  border:1px solid #ddd;
  font-size:15px;
  font-weight:600;
}

.googleBtn:disabled{
  opacity:.65;
  cursor:not-allowed;
}

/* APP */

#chatApp{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:#f6f7fb;
}

/* HEADER */

.appHeader{
  height:65px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  border-bottom:1px solid #eee;
  flex-shrink:0;
}

.appTitle{
  font-size:21px;
  font-weight:700;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:10px;
}

.iconBtn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#f1f2f6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

.profileMini{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
}

/* HOME */

#homeScreen{
  flex:1;
  overflow-y:auto;
  padding-bottom:70px;
}

.storySection{
  background:#fff;
  padding:12px;
  border-bottom:1px solid #eee;
}

.storyTitle{
  font-weight:600;
  margin-bottom:10px;
}

.storyRow{
  display:flex;
  gap:13px;
  overflow-x:auto;
}

.story{
  min-width:65px;
  text-align:center;
  font-size:11px;
}

.story img{
  width:56px;
  height:56px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #6c63ff;
}

.storyAdd{
  width:56px;
  height:56px;
  border-radius:50%;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  margin:auto;
}

/* TABS */

.chatTabs{
  display:flex;
  background:#fff;
  padding:8px;
  gap:5px;
  border-bottom:1px solid #eee;
}

.chatTab{
  flex:1;
  padding:9px 5px;
  border-radius:10px;
  background:transparent;
  font-size:12px;
}

.chatTab.active{
  background:#6c63ff;
  color:white;
}

/* CHAT LIST */

#chatList{
  padding:5px 0;
}

.chatItem{
  background:#fff;
  padding:12px 15px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #f0f0f0;
}

.chatAvatar{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.chatInfo{
  flex:1;
  min-width:0;
}

.chatTop{
  display:flex;
  justify-content:space-between;
}

.chatName{
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chatTime{
  font-size:10px;
  color:#999;
}

.chatLast{
  color:#888;
  font-size:12px;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.unreadBadge{
  min-width:20px;
  height:20px;
  padding:0 5px;
  border-radius:20px;
  background:#6c63ff;
  color:#fff;
  font-size:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* BOTTOM NAV */

.bottomNav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:62px;
  background:#fff;
  border-top:1px solid #eee;
  display:flex;
  z-index:50;
}

.navBtn{
  flex:1;
  background:#fff;
  font-size:11px;
  color:#777;
}

.navBtn span{
  display:block;
  font-size:21px;
  margin-bottom:1px;
}

.navBtn.active{
  color:#6c63ff;
}

/* CHAT SCREEN */

#chatScreen{
  position:fixed;
  inset:0;
  background:#e9eef3;
  z-index:100;
  display:none;
  flex-direction:column;
}

.chatHeader{
  height:62px;
  background:#fff;
  display:flex;
  align-items:center;
  padding:0 10px;
  gap:8px;
  border-bottom:1px solid #eee;
  flex-shrink:0;
}

.backBtn{
  width:40px;
  height:40px;
  background:transparent;
  font-size:24px;
}

.chatUserAvatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
}

.chatUserInfo{
  flex:1;
  min-width:0;
}

.chatUserName{
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chatStatus{
  font-size:10px;
  color:#777;
}

.chatHeaderMenu{
  width:40px;
  height:40px;
  background:transparent;
  font-size:22px;
}

/* MESSAGES */

#messages{
  flex:1;
  overflow-y:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.messageRow{
  display:flex;
  width:100%;
}

.messageRow.mine{
  justify-content:flex-end;
}

.messageBubble{
  max-width:78%;
  padding:8px 10px 5px;
  border-radius:13px;
  background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.08);
  word-break:break-word;
}

.messageRow.mine .messageBubble{
  background:#d9fdd3;
  border-top-right-radius:4px;
}

.messageRow:not(.mine) .messageBubble{
  border-top-left-radius:4px;
}

.messageText{
  font-size:14px;
  white-space:pre-wrap;
}

.messageMeta{
  text-align:right;
  font-size:9px;
  color:#888;
  margin-top:2px;
}

.statusTicks{
  font-size:10px;
  margin-left:2px;
}

/* MESSAGE BAR */

.messageBar{
  min-height:62px;
  background:#fff;
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px;
  border-top:1px solid #ddd;
}

.emojiButton,
.attachButton,
.cameraButton,
.voiceButton,
.sendButton{
  width:40px;
  height:40px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.emojiButton,
.attachButton,
.cameraButton,
.voiceButton{
  background:#f1f2f6;
}

.sendButton{
  background:#6c63ff;
  color:#fff;
}

#messageInput{
  flex:1;
  min-width:0;
  border:0;
  background:#f1f2f6;
  border-radius:22px;
  padding:11px 14px;
  font-size:14px;
}

/* ATTACHMENT */

#attachmentSheet{
  position:fixed;
  bottom:65px;
  left:8px;
  right:8px;
  background:#fff;
  border-radius:18px;
  padding:12px;
  box-shadow:0 8px 30px rgba(0,0,0,.18);
  z-index:200;
  display:none;
}

.attachmentGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.attachOption{
  background:#f6f6f8;
  border-radius:14px;
  padding:12px 5px;
  text-align:center;
  font-size:11px;
}

.attachIcon{
  font-size:25px;
  margin-bottom:4px;
}

/* EMOJI */

#emojiPanel{
  position:fixed;
  bottom:62px;
  left:0;
  right:0;
  height:250px;
  background:#fff;
  border-top:1px solid #ddd;
  z-index:190;
  display:none;
  overflow-y:auto;
  padding:12px;
}

.emojiGrid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:12px;
}

.emojiItem{
  font-size:24px;
  text-align:center;
  background:transparent;
}

/* MODALS */

.modalOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:300;
  display:none;
  align-items:flex-end;
}

.modalBox{
  width:100%;
  max-height:80vh;
  background:#fff;
  border-radius:22px 22px 0 0;
  padding:18px;
  overflow-y:auto;
}

.modalTitle{
  font-size:18px;
  font-weight:600;
  margin-bottom:15px;
}

.closeModal{
  float:right;
  background:#eee;
  width:32px;
  height:32px;
  border-radius:50%;
}

/* USER LIST */

.userItem{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 0;
  border-bottom:1px solid #eee;
}

.userItem img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
}

.userInfo{
  flex:1;
}

.userName{
  font-weight:600;
}

.userEmail{
  font-size:10px;
  color:#888;
}

/* MENU */

#chatMenu{
  position:fixed;
  top:58px;
  right:8px;
  background:#fff;
  border-radius:13px;
  box-shadow:0 8px 25px rgba(0,0,0,.2);
  z-index:250;
  display:none;
  overflow:hidden;
  min-width:160px;
}

.menuItem{
  display:block;
  width:100%;
  background:#fff;
  text-align:left;
  padding:12px 15px;
  font-size:13px;
}

.menuItem:hover{
  background:#f5f5f5;
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:#999;
  font-size:13px;
}

.onlineDot{
  color:#22b573;
}

.offlineDot{
  color:#aaa;
}

/* LOGIN LOADING */

#loginLoading{
  position:fixed;
  inset:0;
  background:#fff;
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

.loadingLogo{
  font-size:30px;
  font-weight:700;
}

.loadingText{
  margin-top:8px;
  color:#777;
  font-size:13px;
}

.loadingDot{
  margin-top:12px;
  font-size:20px;
  letter-spacing:4px;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

<!-- NEW CHAT MODAL -->

<div id="newChatModal"

</div>

    <div id="blockedList"></div>

  </div>

</div>


<!-- CHAT SCREEN -->

<div id="chatScreen">

  <header class="chatHeader">

<input id="cameraInput"
       type="file"
       accept="image/*"
       capture="environment"
       style="display:none">


<script type="module">

/* =====================================================
   FIREBASE
   ===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithRedirect,
  getRedirectResult,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDoc,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  query,
  where,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
   ===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyCzPOAjXI0dJ33RJCFGyeI50Dvd0",

  authDomain:
    "oii-chat-8802e.firebaseapp.com",

  projectId:
    "oii-chat-8802e",

  storageBucket:
    "oii-chat-8802e.firebasestorage.app",

  messagingSenderId:
    "1017345795063",

  appId:
    "1:1017345795063:web:7fc1dfedd027c4be0d84f2",

  measurementId:
    "G-304SPRZSPL"
};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

const provider =
  new GoogleAuthProvider();


/* =====================================================
   VARIABLES
   ===================================================== */

let currentUser = null;
let currentChatUser = null;
let currentChatId = null;

let unsubscribeMessages = null;
let unsubscribeChats = null;

let blockedUsers = [];


/* =====================================================
   ELEMENTS
   ===================================================== */

const loginScreen =
  document.getElementById("loginScreen");

const loginLoading =
  document.getElementById("loginLoading");

const chatApp =
  document.getElementById("chatApp");

const googleLoginBtn =
  document.getElementById("googleLoginBtn");

const myProfileImg =
  document.getElementById("myProfileImg");

const chatScreen =
  document.getElementById("chatScreen");

const homeScreen =
  document.getElementById("homeScreen");

const messages =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const sendMessageBtn =
  document.getElementById("sendMessageBtn");

const attachBtn =
  document.getElementById("attachBtn");

const attachmentSheet =
  document.getElementById("attachmentSheet");

const emojiBtn =
  document.getElementById("emojiBtn");

const emojiPanel =
  document.getElementById("emojiPanel");

const emojiGrid =
  document.getElementById("emojiGrid");

const cameraBtn =
  document.getElementById("cameraBtn");

const voiceBtn =
  document.getElementById("voiceBtn");

const galleryOption =
  document.getElementById("galleryOption");

const documentOption =
  document.getElementById("documentOption");

const locationOption =
  document.getElementById("locationOption");

const contactOption =
  document.getElementById("contactOption");


/* =====================================================
   AUTH PERSISTENCE
   ===================================================== */

try{

  await setPersistence(
    auth,
    browserLocalPersistence
  );

}catch(error){

  console.error(
    "Auth persistence:",
    error
  );

}


/* =====================================================
   GOOGLE LOGIN
   MOBILE + GITHUB PAGES
   ===================================================== */

googleLoginBtn.addEventListener(
  "click",
  async()=>{

    try{

      googleLoginBtn.disabled =
        true;

      googleLoginBtn.textContent =
        "Opening Oii Chat...";

      loginScreen.style.display =
        "none";

      loginLoading.style.display =
        "flex";


      await signInWithRedirect(
        auth,
        provider
      );

    }catch(error){

      console.error(
        "Google login:",
        error
      );

      loginLoading.style.display =
        "none";

      loginScreen.style.display =
        "flex";

      googleLoginBtn.disabled =
        false;

      googleLoginBtn.textContent =
        "🔵 Continue with Google";


      alert(
        "Google login failed.\n\n" +
        error.message
      );

    }

  }
);


/* =====================================================
   REDIRECT RESULT
   ===================================================== */

try{

  await getRedirectResult(auth);

}catch(error){

  console.error(
    "Google redirect result:",
    error
  );

  loginLoading.style.display =
    "none";

    }

/* =====================================================
   CHAT ID
   ===================================================== */

function makeChatId(
  uid1,
  uid2
){

  return [
    uid1,
    uid2
  ].sort().join("_");

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(text){

  if(
    text === undefined ||
    text === null
  ){

    return "";

  }

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   TIME
   ===================================================== */

function formatTime(timestamp){

  if(!timestamp)
    return "";

  try{

    const date =
      timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);

    return date.toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }catch{

    return "";

  }

}

function loadMyChats(){

  if(!currentUser)
    return;

  const chatsRef =
    collection(
      db,
      "chats"
    );

  const q =
    query(
      chatsRef,
      where(
        "members",
        "array-contains",
        currentUser.uid
      )
    );


  if(unsubscribeChats){

  }


  unsubscribeChats =
    onSnapshot(
      q,
      snapshot=>{

        renderAllChats(
          snapshot.docs
        );

      },
      error=>{

        console.error(
          "Chats error:",
          error
        );

      }
    );

}


/* =====================================================
   RENDER CHATS
   ===================================================== */

async function renderAllChats(docs){

  const chatList =
    document.getElementById(
      "chatList"
    );


  if(!docs.length){

    chatList.innerHTML =
      `<div class="empty">
        No chats yet 💬
      </div>`;

    return;

  }


  const chats = [];


  for(
    const item of docs
  ){

    const data =
      item.data();


    const otherId =
      data.members.find(
        id =>
          id !== currentUser.uid
      );


    if(!otherId)
      continue;


    if(isBlocked(otherId))
      continue;


    const userSnap =
      await getDoc(
        doc(
          db,
          "users",
          otherId
        )
      );


    if(!userSnap.exists())
      continue;


    chats.push({

      id:item.id,

      data,

      user:userSnap.data()

    });

  }


  chats.sort(
    (a,b)=>{

      const ta =
        a.data.updatedAt?.seconds ||
        0;

      const tb =
        b.data.updatedAt?.seconds ||
        0;

      return tb-ta;

    }
  );


  if(!chats.length){

    chatList.innerHTML =
      `<div class="empty">
        No chats yet 💬
      </div>`;

    return;

  }


  chatList.innerHTML =
    chats.map(
      chat=>{

        const user =
          chat.user;


        return `
          <div class="chatItem"
               data-chat-id="${escapeHTML(chat.id)}"
               data-user-id="${escapeHTML(user.uid)}">

            <img class="chatAvatar"
                 src="${escapeHTML(
                   user.photoURL ||
                   "https://ui-avatars.com/api/?name="+
                   encodeURIComponent(
                     user.name || "User"
                   )
                 )}">

            <div class="chatInfo">

              <div class="chatTop">

                <div class="chatName">
                  ${escapeHTML(
                    user.name || "User"
                  )}
                </div>

                <div class="chatTime">
                  ${formatTime(
                    chat.data.updatedAt
                  )}
                </div>

              </div>

              <div class="chatLast">
                ${escapeHTML(
                  chat.data.lastMessage ||
                  ""
                )}
              </div>

            </div>

          </div>
        `;

      }
    ).join("");


  document
    .querySelectorAll(
      ".chatItem"
    )
    .forEach(
      item=>{

        item.addEventListener(
          "click",
          async()=>{

            await openChat(
              item.dataset.userId
            );

          }
        );

      }
    );

}

/* =====================================================
   LOAD MESSAGES
   ===================================================== */

function loadMessages(){

  if(!currentChatId)
    return;


  if(unsubscribeMessages){

    unsubscribeMessages();

  }


  const ref =
    collection(
      db,
      "chats",
      currentChatId,
      "messages"
    );


  const q =
    query(
      ref,
      orderBy(
        "createdAt",
        "asc"
      )
    );


  unsubscribeMessages =
    onSnapshot(
      q,
      snapshot=>{

        messages.innerHTML =
          "";


        snapshot.docs.forEach(
          d=>{

            renderMessage(
              d.data()
            );

          }
        );


        setTimeout(
          ()=>{

            messages.scrollTop =
              messages.scrollHeight;

          },
          50
        );

      },
      error=>{

        console.error(
          "Messages error:",
          error
        );

      }
    );

}


/* =====================================================
   RENDER MESSAGE
   ===================================================== */

function renderMessage(data){

  const mine =
    data.senderId ===
    currentUser.uid;


  const row =
    document.createElement(
      "div"
    );


  row.className =
    "messageRow " +
    (mine ? "mine" : "");


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "messageBubble";


  const text =
    document.createElement(
      "div"
    );


  text.className =
    "messageText";


  text.textContent =
    data.text || "";


  const meta =
    document.createElement(
      "div"
    );


  meta.className =
    "messageMeta";


  if(mine){

    let tick =
      "✓";


    if(
      data.status ===
      "delivered"
    ){

      tick =
        "✓✓";

    }


    if(
      data.status ===
      "read"
    ){

      tick =
        "✓✓";

    }


    meta.innerHTML =
      escapeHTML(
        formatTime(
          data.createdAt
        )
      ) +
      ` <span class="statusTicks">
        ${tick}
      </span>`;

  }else{

    meta.textContent =
      formatTime(
        data.createdAt
      );

  }


  bubble.appendChild(
    text
  );

  bubble.appendChild(
    meta
  );

  row.appendChild(
    bubble
  );

  messages.appendChild(
    row
  );

}


/* =====================================================
   SEND MESSAGE
   ===================================================== */

async function sendMessage(){

  if(
    !currentUser ||
    !currentChatUser ||
    !currentChatId
  ){

    return;

  }


  const text =
    messageInput.value.trim();


  if(!text)
    return;


  if(
    isBlocked(
      currentChatUser.uid
    )
  ){

    alert(
      "இந்த user-ஐ நீ block பண்ணியிருக்கிறாய் 🚫"
    );

    return;

  }


  messageInput.value =
    "";


  try{

    const chatRef =
      doc(
        db,
        "chats",
        currentChatId
      );


    await setDoc(
      chatRef,
      {

        members:[
          currentUser.uid,
          currentChatUser.uid
        ],

        lastMessage:
          text,

        updatedAt:
          serverTimestamp()

      },
      {
        merge:true
      }
    );


    await addDoc(
      collection(
        db,
        "chats",
        currentChatId,
        "messages"
      ),
      {

        senderId:
          currentUser.uid,

        receiverId:
          currentChatUser.uid,

        text:
          text,

        createdAt:
          serverTimestamp(),

        status:
          "sent"

      }
    );

  }catch(error){

    console.error(error);

    alert(
      "Message send failed.\n\n" +
      error.message
    );

  }

}

/* =====================================================

   ===================================================== */

let mediaRecorder =
  null;

let audioChunks =
  [];


voiceBtn.addEventListener(
  "click",
  async()=>{

    if(
      mediaRecorder &&
      mediaRecorder.state ===
      "recording"
    ){

      mediaRecorder.stop();

      return;

    }


    try{

      const stream =
        await navigator.mediaDevices
          .getUserMedia({
            audio:true
          });


      mediaRecorder =
        new MediaRecorder(
          stream
        );


      audioChunks =
        [];


      mediaRecorder.ondataavailable =
        e=>{

          if(e.data.size > 0){

            audioChunks.push(
              e.data
            );

          }

        };


      mediaRecorder.onstop =
        ()=>{

          stream
            .getTracks()
            .forEach(
              track =>
                track.stop()
            );


          voiceBtn.textContent =
            "🎙️";


          alert(
            "🎙️ Voice recorded.\n\n" +
            "Firebase Storage upload next step."
          );

        };


      mediaRecorder.start();

      voiceBtn.textContent =
        "⏹️";


    }catch(error){

      alert(
        "Microphone permission allow பண்ணு."
      );

    }

  }
);

        e.target.value
          .toLowerCase()
          .trim();


      const snap =
        await getDocs(
          collection(
            db,
            "users"
          )
        );


      const users =
        snap.docs
          .map(
            d=>d.data()
          )
          .filter(
            u=>
              u.uid !==
              currentUser.uid &&

              !isBlocked(u.uid) &&

              (
                (u.name || "")
                  .toLowerCase()
                  .includes(text) ||

                (u.email || "")
                  .toLowerCase()
                  .includes(text)
              )
          );


      renderUsers(users);

    }
  );

/* =====================================================
   RENDER BLOCKED USERS
   ===================================================== */

async function renderBlockedUsers(){

  const list =
    document.getElementById(
      "blockedList"
    );


  if(!blockedUsers.length){

    list.innerHTML =
      `<div class="empty">
        No blocked accounts 🚫
      </div>`;

    return;

  }


  list.innerHTML =
    `<div class="empty">
      Loading...
    </div>`;


  const users = [];


  for(
    const uid of blockedUsers
  ){

    const snap =
      await getDoc(
        doc(
          db,
          "users",
          uid
        )
      );


    if(snap.exists()){

      users.push(
        snap.data()
      );

    }

  }


  list.innerHTML =
    users.map(
      user=>`

        <div class="userItem">

          <img src="${escapeHTML(
            user.photoURL ||
            "https://ui-avatars.com/api/?name="+
            encodeURIComponent(
              user.name ||
              "User"
            )
          )}">

          <div class="userInfo">

            <div class="userName">
              ${escapeHTML(
                user.name ||
                "User"
              )}
            </div>

          </div>

          <button
            class="unblockFromList"
            data-uid="${escapeHTML(user.uid)}"
            style="
              background:#6c63ff;
              color:white;
              padding:8px 12px;
              border-radius:10px;
              font-size:11px;
            ">
            Unblock
          </button>

        </div>

      `
    ).join("");


  document
    .querySelectorAll(
      ".unblockFromList"
    )
    .forEach(
      btn=>{

        btn.addEventListener(
          "click",
          async()=>{

            await unblockUser(
              btn.dataset.uid
            );

            renderBlockedUsers();

          }
        );

      }
    );

}


/* =====================================================
   BLOCK USER
   ===================================================== */

async function blockUser(uid){

  if(
    !currentUser ||
    !uid
  )
    return;


  try{

    await setDoc(
      doc(
        db,
        "users",
        currentUser.uid,
        "blocked",
        uid
      ),
      {
        blockedAt:
          serverTimestamp()
      }
    );


    if(
      !blockedUsers.includes(uid)
    ){

      blockedUsers.push(uid);

    }


    if(
      currentChatUser &&
      currentChatUser.uid === uid
    ){

      alert(
        "User blocked 🚫"
      );


      document
        .getElementById(
          "backBtn"
        )
        .click();

    }


  }catch(error){

    console.error(error);

    alert(
      "Block failed.\n\n" +
      error.message
    );

  }

}


/* =====================================================
   UNBLOCK USER
   ===================================================== */

async function unblockUser(uid){

  if(
    !currentUser ||
    !uid
  )
    return;


  try{

    await deleteDoc(
      doc(
        db,
        "users",
        currentUser.uid,
        "blocked",
        uid
      )
    );


    blockedUsers =
      blockedUsers.filter(
        id =>
          id !== uid
      );


    alert(
      "User unblocked ✅"
    );


  }catch(error){

    console.error(error);

    alert(
      "Unblock failed.\n\n" +
      error.message
    );

  }

}

          .getElementById(

          )
          .style.display =

        document
          .getElementById(
            "unblockUserBtn"
          )

      }

    }
  );

document

        );


      if(!ok)

      try{

        await updateDoc(

            db,
            "chats",
            currentChatId

          {
            deletedFor:[

          }

        alert(

          .getElementById(
            "backBtn"

          .click();

          error.message
        );

      }

    }
  );

   OUTSIDE CLICK
   ===================================================== */

document.addEventListener(
  "click",
  e=>{

    if(
      !e.target.closest(
        "#attachmentSheet"
      ) &&
      !e.target.closest(
        "#attachBtn"
      )
    ){

      attachmentSheet.style.display =
        "none";

    }


    if(
      !e.target.closest(
        "#emojiPanel"
      ) &&
      !e.target.closest(
        "#emojiBtn"
      )
    ){

      emojiPanel.style.display =
        "none";

    }


    if(
      !e.target.closest(
        "#chatMenu"
      ) &&
      !e.target.closest(
        "#chatMenuBtn"
      )
    ){

      document
        .getElementById(
          "chatMenu"
        )
        .style.display =

    }

);


/* =====================================================
   ONLINE HEARTBEAT
   ===================================================== */

setInterval(
  async()=>{

    if(!currentUser)
      return;


    try{

      await updateDoc(
        doc(
          db,
          "users",
          currentUser.uid
        ),
        {

          online:true,

          lastSeen:
            serverTimestamp()

        }
      );

    }catch(error){

      console.log(error);

    }

  },
  30000
);


/* =====================================================
   OFFLINE
   ===================================================== */

window.addEventListener(
  "beforeunload",
  ()=>{

    if(!currentUser)
      return;


    updateDoc(
      doc(
        db,
        "users",
        currentUser.uid
      ),
      {

        online:false,

        lastSeen:
          serverTimestamp()

      }
    ).catch(
      ()=>{}
    );

  }
);


/* =====================================================
   ESCAPE
   ===================================================== */

window.addEventListener(
  "keydown",
  e=>{

    if(
      e.key === "Escape"
    ){

      attachmentSheet.style.display =
        "none";

      emojiPanel.style.display =
        "none";

      document
        .getElementById(
          "chatMenu"
        )
        .style.display =
        "none";

    }

  }
);
