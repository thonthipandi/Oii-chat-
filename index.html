<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Oii Chat 💬</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #050515;
      color: white;
      min-height: 100vh;
    }

    button {
      font-family: inherit;
    }

    /* ================= LOGIN ================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      background:
        radial-gradient(
          circle at top,
          rgba(0, 212, 255, .18),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom,
          rgba(255, 0, 127, .15),
          transparent 35%
        ),
        #050515;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      padding: 35px 25px;

      text-align: center;

      background: rgba(15, 15, 45, .88);
      border: 1px solid rgba(0, 212, 255, .25);
      border-radius: 25px;

      box-shadow: 0 0 35px rgba(0, 212, 255, .12);
      backdrop-filter: blur(15px);
    }

    .login-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 22px;
      font-size: 42px;

      background: linear-gradient(45deg, #00d4ff, #ff007f);

      box-shadow: 0 0 25px rgba(0, 212, 255, .5);
    }

    .login-title {
      font-size: 30px;
      font-weight: 700;

      background: linear-gradient(45deg, #00d4ff, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-subtitle {
      color: #aaa;
      font-size: 14px;
      margin: 8px 0 28px;
    }

    #googleLoginBtn {
      width: 100%;
      padding: 14px;

      border: none;
      border-radius: 14px;

      background: white;
      color: #222;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    #googleLoginBtn:disabled {
      opacity: .7;
      cursor: wait;
    }

    #googleLoginBtn i {
      color: #4285F4;
      font-size: 20px;
    }

    #loginError {
      display: none;
      margin-top: 15px;
      color: #ff668f;
      font-size: 12px;
      line-height: 1.5;
    }

    /* ================= APP ================= */

    #appScreen {
      display: none;
    }

    .app-container {
      width: 100%;
      max-width: 450px;
      min-height: 100vh;
      margin: auto;

      background: #080820;

      position: relative;

      padding-bottom: 80px;

      border-left: 1px solid rgba(0, 212, 255, .2);
      border-right: 1px solid rgba(0, 212, 255, .2);
    }

    /* ================= HEADER ================= */

    .header {
      padding: 15px 20px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      background: rgba(10, 10, 35, .95);

      position: sticky;
      top: 0;

      z-index: 100;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;

      background: linear-gradient(45deg, #00d4ff, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-icons {
      display: flex;
      gap: 18px;

      color: #00d4ff;
      font-size: 18px;
    }

    .header-icons i {
      cursor: pointer;
    }

    /* ================= USER ================= */

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;

      padding: 14px 20px 8px;
    }

    .user-profile img {
      width: 45px;
      height: 45px;

      border-radius: 50%;

      border: 2px solid #00d4ff;

      object-fit: cover;
    }

    .user-details {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-size: 14px;
      font-weight: 600;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .user-email {
      margin-top: 2px;

      font-size: 10px;
      color: #777;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .logout-btn {
      background: rgba(255, 0, 127, .12);
      color: #ff4f9a;

      border: 1px solid rgba(255, 0, 127, .25);

      border-radius: 10px;

      padding: 7px 10px;

      cursor: pointer;

      font-size: 11px;
    }

    /* ================= STORIES ================= */

    .stories-container {
      display: flex;
      gap: 15px;

      padding: 15px 20px;

      overflow-x: auto;
      scrollbar-width: none;
    }

    .stories-container::-webkit-scrollbar {
      display: none;
    }

    .story {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 5px;

      font-size: 12px;

      flex-shrink: 0;
    }

    .story-avatar {
      width: 60px;
      height: 60px;

      padding: 3px;

      border-radius: 50%;

      background: linear-gradient(45deg, #00d4ff, #ff007f);

      position: relative;
    }

    .story-avatar img {
      width: 100%;
      height: 100%;

      border-radius: 50%;

      object-fit: cover;

      border: 2px solid #080820;
    }

    .add-story {
      position: absolute;

      bottom: 0;
      right: 0;

      width: 18px;
      height: 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #00d4ff;
      color: black;

      font-size: 12px;
      font-weight: bold;
    }

    /* ================= TABS ================= */

    .tabs {
      display: flex;
      gap: 10px;

      padding: 10px 20px;

      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      padding: 7px 16px;

      border-radius: 20px;

      font-size: 13px;

      white-space: nowrap;

      background: rgba(255,255,255,.05);

      color: #aaa;

      border: 1px solid rgba(255,255,255,.1);

      cursor: pointer;
    }

    .tab.active {
      background: linear-gradient(45deg, #00d4ff, #ff007f);

      color: white;

      font-weight: 600;

      border: none;
    }

    /* ================= CHAT LIST ================= */

    .chat-list {
      padding: 10px 20px;

      display: flex;
      flex-direction: column;

      gap: 12px;
    }

    .chat-card {
      display: flex;
      align-items: center;

      gap: 15px;

      padding: 12px;

      background: rgba(20,20,50,.6);

      border-radius: 16px;

      border: 1px solid rgba(0,212,255,.2);

      cursor: pointer;

      transition: .2s;
    }

    .chat-card:hover {
      border-color: rgba(0,212,255,.5);
      transform: translateY(-1px);
    }

    .avatar {
      width: 50px;
      height: 50px;

      flex-shrink: 0;

      border-radius: 50%;

      border: 2px solid #ff007f;

      position: relative;
    }

    .avatar img {
      width: 100%;
      height: 100%;

      border-radius: 50%;

      object-fit: cover;
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-top {
      display: flex;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 4px;
    }

    .chat-name {
      font-weight: 600;
      font-size: 15px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-time {
      font-size: 10px;
      color: #888;
      white-space: nowrap;
    }

    .chat-msg {
      font-size: 13px;
      color: #aaa;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 40px 20px;
      font-size: 13px;
    }

    /* ================= FAB ================= */

    .fab {
      position: fixed;

      bottom: 80px;

      right: max(20px, calc((100vw - 450px) / 2 + 20px));

      width: 55px;
      height: 55px;

      border: none;

      border-radius: 50%;

      background: linear-gradient(45deg, #00d4ff, #ff007f);

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 22px;

      box-shadow: 0 0 15px rgba(0,212,255,.5);

      cursor: pointer;

      z-index: 90;
    }

    /* ================= NAV ================= */

    .nav {
      position: fixed;

      bottom: 0;

      width: 100%;
      max-width: 450px;

      height: 65px;

      background: rgba(10,10,35,.97);

      display: flex;

      justify-content: space-around;
      align-items: center;

      border-top: 1px solid rgba(255,255,255,.1);

      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;

      align-items: center;

      gap: 3px;

      font-size: 10px;

      color: #666;

      cursor: pointer;
    }

    .nav-item.active {
      color: #00d4ff;
    }

    .nav-item i {
      font-size: 18px;
    }

    /* ================= MODAL ================= */

    .modal {
      display: none;

      position: fixed;

      inset: 0;

      background: rgba(0,0,0,.75);

      z-index: 500;

      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .modal-box {
      width: 100%;
      max-width: 400px;

      max-height: 80vh;

      overflow: hidden;

      background: #10102d;

      border: 1px solid rgba(0,212,255,.25);

      border-radius: 22px;

      box-shadow: 0 0 30px rgba(0,0,0,.5);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 18px 20px;

      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .modal-header h3 {
      font-size: 18px;
    }

    .close-btn {
      background: none;
      border: none;

      color: #aaa;

      font-size: 20px;

      cursor: pointer;
    }

    .users-list {
      padding: 10px;

      max-height: 60vh;

      overflow-y: auto;
    }

    .user-card {
      display: flex;
      align-items: center;

      gap: 12px;

      padding: 12px;

      border-radius: 14px;

      cursor: pointer;
    }

    .user-card:hover {
      background: rgba(255,255,255,.06);
    }

    .user-card img {
      width: 45px;
      height: 45px;

      border-radius: 50%;

      object-fit: cover;

      border: 2px solid #00d4ff;
    }

    .user-card-info {
      flex: 1;
      min-width: 0;
    }

    .user-card-name {
      font-size: 14px;
      font-weight: 600;
    }

    .user-card-email {
      color: #777;
      font-size: 10px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ================= CHAT SCREEN ================= */

    #chatScreen {
      display: none;

      position: fixed;

      inset: 0;

      background: #080820;

      z-index: 300;
    }

    .chat-page {
      width: 100%;
      max-width: 450px;

      height: 100%;

      margin: auto;

      display: flex;
      flex-direction: column;

      background: #080820;
    }

    .chat-header {
      height: 65px;

      flex-shrink: 0;

      display: flex;
      align-items: center;

      gap: 12px;

      padding: 10px 15px;

      background: #0d0d2b;

      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .back-btn {
      width: 35px;
      height: 35px;

      border: none;
      background: none;

      color: white;

      font-size: 20px;

      cursor: pointer;
    }

    .chat-header img {
      width: 40px;
      height: 40px;

      border-radius: 50%;

      object-fit: cover;
    }

    .chat-header-info {
      flex: 1;
      min-width: 0;
    }

    .chat-header-name {
      font-size: 14px;
      font-weight: 600;
    }

    .chat-header-status {
      color: #00ff66;
      font-size: 10px;
    }

    .messages {
      flex: 1;

      overflow-y: auto;

      padding: 20px 15px;

      display: flex;
      flex-direction: column;

      gap: 8px;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message {
      max-width: 75%;

      padding: 9px 12px;

      border-radius: 15px;

      font-size: 13px;

      word-wrap: break-word;

      background: #1b1b42;

      color: white;
    }

    .message-row.mine .message {
      background: linear-gradient(45deg, #007ea0, #a90055);
    }

    .message-time {
      display: block;

      margin-top: 3px;

      font-size: 8px;

      color: rgba(255,255,255,.55);

      text-align: right;
    }

    .message-input-area {
      display: flex;

      gap: 8px;

      padding: 10px;

      background: #0d0d2b;

      border-top: 1px solid rgba(255,255,255,.08);
    }

    #messageInput {
      flex: 1;

      min-width: 0;

      border: 1px solid rgba(0,212,255,.2);

      outline: none;

      border-radius: 22px;

      padding: 11px 15px;

      background: #151535;

      color: white;

      font-size: 13px;
    }

    #messageInput::placeholder {
      color: #777;
    }

    #sendMessageBtn {
      width: 45px;
      height: 45px;

      flex-shrink: 0;

      border: none;

      border-radius: 50%;

      background: linear-gradient(45deg,#00d4ff,#ff007f);

      color: white;

      cursor: pointer;
    }

    @media (max-width: 450px) {

      .app-container {
        border: none;
      }

      .nav {
        max-width: 100%;
      }

      .fab {
        right: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- ================= LOGIN ================= -->

  <div id="loginScreen">

    <div class="login-box">

      <div class="login-logo">
        💬
      </div>

      <div class="login-title">
        Oii Chat
      </div>

      <div class="login-subtitle">
        Tamil First Chat App 💙
      </div>

      <button id="googleLoginBtn">
        <i class="fab fa-google"></i>
        Continue with Google
      </button>

      <div id="loginError"></div>

    </div>

  </div>


  <!-- ================= APP ================= -->

  <div id="appScreen">

    <div class="app-container">

      <!-- HEADER -->

      <div class="header">

        <div class="logo-text">
          Oii Chat 💬
        </div>

        <div class="header-icons">

          <i
            class="fas fa-search"
            id="searchBtn"
          ></i>

          <i
            class="fas fa-ellipsis-v"
            id="moreBtn"
          ></i>

        </div>

      </div>


      <!-- PROFILE -->

      <div class="user-profile">

        <img
          id="userPhoto"
          src="https://i.pravatar.cc/100"
          alt="Profile"
        >

        <div class="user-details">

          <div
            class="user-name"
            id="userName"
          >
            Oii User
          </div>

          <div
            class="user-email"
            id="userEmail"
          >
            Loading...
          </div>

        </div>

        <button
          class="logout-btn"
          id="logoutBtn"
        >
          Logout
        </button>

      </div>


      <!-- STORIES -->

      <div class="stories-container">

        <div class="story">

          <div class="story-avatar">

            <img
              id="myStoryPhoto"
              src="https://i.pravatar.cc/100"
            >

            <div class="add-story">
              +
            </div>

          </div>

          <span>
            My Story
          </span>

        </div>

      </div>


      <!-- TABS -->

      <div class="tabs">

        <div
          class="tab active"
          data-tab="all"
        >
          All Chats
        </div>

        <div
          class="tab"
          data-tab="unread"
        >
          Unread
        </div>

        <div
          class="tab"
          data-tab="groups"
        >
          Groups
        </div>

        <div
          class="tab"
          data-tab="channels"
        >
          Channels
        </div>

      </div>


      <!-- CHAT LIST -->

      <div
        class="chat-list"
        id="chatList"
      >

        <div class="empty">
          Loading chats... 💬
        </div>

      </div>


      <!-- NEW CHAT -->

      <button
        class="fab"
        id="newChatBtn"
      >

        <i class="fas fa-plus"></i>

      </button>


      <!-- BOTTOM NAV -->

      <div class="nav">

        <div class="nav-item active">

          <i class="fas fa-comment-dots"></i>

          <span>
            Chats
          </span>

        </div>

        <div class="nav-item">

          <i class="fas fa-phone-alt"></i>

          <span>
            Calls
          </span>

        </div>

        <div class="nav-item">

          <i class="fas fa-circle-notch"></i>

          <span>
            Status
          </span>

        </div>

        <div class="nav-item">

          <i class="fas fa-users"></i>

          <span>
            Communities
          </span>

        </div>

        <div class="nav-item">

          <i class="fas fa-cog"></i>

          <span>
            Settings
          </span>

        </div>

      </div>

    </div>

  </div>


  <!-- ================= NEW CHAT MODAL ================= -->

  <div
    class="modal"
    id="usersModal"
  >

    <div class="modal-box">

      <div class="modal-header">

        <h3>
          New Chat 💬
        </h3>

        <button
          class="close-btn"
          id="closeUsersModal"
        >
          ×
        </button>

      </div>

      <div
        class="users-list"
        id="usersList"
      >

        <div class="empty">
          Loading Oii Chat users...
        </div>

      </div>

    </div>

  </div>


  <!-- ================= CHAT SCREEN ================= -->

  <div id="chatScreen">

    <div class="chat-page">

      <div class="chat-header">

        <button
          class="back-btn"
          id="backChatBtn"
        >
          <i class="fas fa-arrow-left"></i>
        </button>

        <img
          id="chatUserPhoto"
          src="https://i.pravatar.cc/100"
        >

        <div class="chat-header-info">

          <div
            class="chat-header-name"
            id="chatUserName"
          >
            User
          </div>

          <div class="chat-header-status">
            Oii Chat
          </div>

        </div>

      </div>


      <div
        class="messages"
        id="messages"
      >
      </div>


      <div class="message-input-area">

        <input
          type="text"
          id="messageInput"
          placeholder="Type a message..."
          autocomplete="off"
        >

        <button
          id="sendMessageBtn"
        >

          <i class="fas fa-paper-plane"></i>

        </button>

      </div>

    </div>

  </div>


  <!-- ================= FIREBASE ================= -->

  <script type="module">

    import {
      initializeApp
    }
    from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut
    }
    from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
      getFirestore,
      doc,
      setDoc,
      getDoc,
      collection,
      query,
      where,
      getDocs,
      addDoc,
      onSnapshot,
      orderBy,
      serverTimestamp
    }
    from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* ================= FIREBASE CONFIG ================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyCzPOAjXI0dJ33RJCVIUyCCFGyeI50Dvd0",

      authDomain:
        "oii-chat-8802e.firebaseapp.com",

      projectId:
        "oii-chat-8802e",

      storageBucket:
        "oii-chat-8802e.firebasestorage.app",

      messagingSenderId:
        "1017345795063",

      appId:
        "1:1017345795063:web:7fc1dfedd027c4be0d84f2",

      measurementId:
        "G-304SPRZSPL"

    };


    /* ================= INITIALIZE ================= */

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);

    const provider =
      new GoogleAuthProvider();


    /* ================= ELEMENTS ================= */

    const loginScreen =
      document.getElementById("loginScreen");

    const appScreen =
      document.getElementById("appScreen");

    const chatScreen =
      document.getElementById("chatScreen");

    const googleLoginBtn =
      document.getElementById("googleLoginBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const loginError =
      document.getElementById("loginError");

    const userName =
      document.getElementById("userName");

    const userEmail =
      document.getElementById("userEmail");

    const userPhoto =
      document.getElementById("userPhoto");

    const myStoryPhoto =
      document.getElementById("myStoryPhoto");

    const newChatBtn =
      document.getElementById("newChatBtn");

    const usersModal =
      document.getElementById("usersModal");

    const closeUsersModal =
      document.getElementById("closeUsersModal");

    const usersList =
      document.getElementById("usersList");

    const chatList =
      document.getElementById("chatList");

    const backChatBtn =
      document.getElementById("backChatBtn");

    const chatUserPhoto =
      document.getElementById("chatUserPhoto");

    const chatUserName =
      document.getElementById("chatUserName");

    const messages =
      document.getElementById("messages");

    const messageInput =
      document.getElementById("messageInput");

    const sendMessageBtn =
      document.getElementById("sendMessageBtn");


    /* ================= VARIABLES ================= */

    let currentUser = null;

    let currentChatId = null;

    let currentChatUser = null;

    let unsubscribeMessages = null;

    let unsubscribeChats = null;


    /* ================= HELPER ================= */

    function makeChatId(uid1, uid2) {

      return [uid1, uid2]
        .sort()
        .join("_");

    }


    function formatTime(timestamp) {

      if (!timestamp) {
        return "";
      }

      const date =
        timestamp.toDate
          ? timestamp.toDate()
          : new Date(timestamp);

      return date.toLocaleTimeString(
        [],
        {
          hour: "numeric",
          minute: "2-digit"
        }
      );

    }


    /* ================= GOOGLE LOGIN ================= */

    googleLoginBtn.addEventListener(
      "click",
      async () => {

        loginError.style.display =
          "none";

        googleLoginBtn.disabled =
          true;

        googleLoginBtn.innerHTML =
          '<i class="fas fa-spinner fa-spin"></i> Signing in...';

        try {

          await signInWithPopup(
            auth,
            provider
          );

        }

        catch (error) {

          console.error(error);

          loginError.style.display =
            "block";

          loginError.textContent =
            "Login failed: " +
            error.message;

          googleLoginBtn.disabled =
            false;

          googleLoginBtn.innerHTML =
            '<i class="fab fa-google"></i> Continue with Google';

        }

      }
    );


    /* ================= SAVE USER ================= */

    async function saveUserProfile(user) {

      const userRef =
        doc(
          db,
          "users",
          user.uid
        );

      const existing =
        await getDoc(userRef);

      const data = {

        uid:
          user.uid,

        name:
          user.displayName ||
          "Oii User",

        email:
          user.email ||
          "",

        photoURL:
          user.photoURL ||
          "",

        lastLogin:
          serverTimestamp()

      };


      if (!existing.exists()) {

        data.createdAt =
          serverTimestamp();

      }


      await setDoc(
        userRef,
        data,
        {
          merge: true
        }
      );

    }


    /* ================= AUTH STATE ================= */

    onAuthStateChanged(
      auth,
      async (user) => {

        currentUser =
          user;

        if (user) {

          loginScreen.style.display =
            "none";

          appScreen.style.display =
            "block";

          userName.textContent =
            user.displayName ||
            "Oii User";

          userEmail.textContent =
            user.email ||
            "";

          if (user.photoURL) {

            userPhoto.src =
              user.photoURL;

            myStoryPhoto.src =
              user.photoURL;

          }

          try {

            await saveUserProfile(
              user
            );

            loadMyChats();

          }

          catch (error) {

            console.error(
              "Profile save error:",
              error
            );

            chatList.innerHTML = `
              <div class="empty">
                Firebase error 😕<br><br>
                ${error.message}
              </div>
            `;

          }

        }

        else {

          loginScreen.style.display =
            "flex";

          appScreen.style.display =
            "none";

          chatScreen.style.display =
            "none";

          if (unsubscribeChats) {

            unsubscribeChats();

            unsubscribeChats =
              null;

          }

        }

      }
    );


    /* ================= LOAD MY CHATS ================= */

    function loadMyChats() {

      if (!currentUser) {
        return;
      }

      const chatsRef =
        collection(
          db,
          "chats"
        );

      const chatsQuery =
        query(
          chatsRef,
          where(
            "participants",
            "array-contains",
            currentUser.uid
          )
        );


      if (unsubscribeChats) {

        unsubscribeChats();

      }


      unsubscribeChats =
        onSnapshot(
          chatsQuery,
          async (snapshot) => {

            chatList.innerHTML = "";

            if (snapshot.empty) {

              chatList.innerHTML = `
                <div class="empty">
                  No chats yet 💬<br><br>
                  Tap + to start a new chat.
                </div>
              `;

              return;

            }


            const chats = [];

            for (
              const chatDoc of snapshot.docs
            ) {

              const data =
                chatDoc.data();

              const otherUid =
                data.participants.find(
                  uid =>
                    uid !== currentUser.uid
                );

              if (!otherUid) {
                continue;
              }


              let otherUser =
                null;


              try {

                const userSnap =
                  await getDoc(
                    doc(
                      db,
                      "users",
                      otherUid
                    )
                  );

                if (
                  userSnap.exists()
                ) {

                  otherUser =
                    userSnap.data();

                }

              }

              catch (error) {

                console.error(error);

              }


              if (otherUser) {

                chats.push({

                  id:
                    chatDoc.id,

                  user:
                    otherUser,

                  lastMessage:
                    data.lastMessage ||
                    "",

                  updatedAt:
                    data.updatedAt ||
                    null

                });

              }

            }


            chats.sort(
              (a,b) => {

                const aTime =
                  a.updatedAt?.toMillis
                    ? a.updatedAt.toMillis()
                    : 0;

                const bTime =
                  b.updatedAt?.toMillis
                    ? b.updatedAt.toMillis()
                    : 0;

                return bTime - aTime;

              }
            );


            chats.forEach(
              chat => {

                renderChatCard(
                  chat
                );

              }
            );


            if (
              chats.length === 0
            ) {

              chatList.innerHTML = `
                <div class="empty">
                  No chats yet 💬
                </div>
              `;

            }

          },
          (error) => {

            console.error(
              "Chat list error:",
              error
            );

            chatList.innerHTML = `
              <div class="empty">
                Unable to load chats 😕<br><br>
                ${error.message}
              </div>
            `;

          }
        );

    }


    /* ================= CHAT CARD ================= */

    function renderChatCard(chat) {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "chat-card";


      const photo =
        chat.user.photoURL ||
        "https://i.pravatar.cc/100";


      div.innerHTML = `

        <div class="avatar">

          <img
            src="${photo}"
            alt="User"
          >

        </div>


        <div class="chat-info">

          <div class="chat-top">

            <span class="chat-name">
              ${escapeHTML(
                chat.user.name ||
                "Oii User"
              )}
            </span>

            <span class="chat-time">
              ${formatTime(
                chat.updatedAt
              )}
            </span>

          </div>


          <div class="chat-msg">

            ${escapeHTML(
              chat.lastMessage ||
              "Start chatting 💬"
            )}

          </div>

        </div>

      `;


      div.addEventListener(
        "click",
        () => {

          openChat(
            chat.id,
            chat.user
          );

        }
      );


      chatList.appendChild(
        div
      );

    }


    /* ================= LOAD ALL USERS ================= */

    async function loadUsers() {

      usersList.innerHTML = `
        <div class="empty">
          Loading Oii Chat users... ⏳
        </div>
      `;


      try {

        const usersSnapshot =
          await getDocs(
            collection(
              db,
              "users"
            )
          );


        usersList.innerHTML = "";


        let count = 0;


        usersSnapshot.forEach(
          userDoc => {

            const user =
              userDoc.data();


            if (
              !currentUser ||
              user.uid === currentUser.uid
            ) {

              return;

            }


            count++;


            const div =
              document.createElement(
                "div"
              );

            div.className =
              "user-card";


            const photo =
              user.photoURL ||
              "https://i.pravatar.cc/100";


            div.innerHTML = `

              <img
                src="${photo}"
                alt="User"
              >

              <div class="user-card-info">

                <div class="user-card-name">
                  ${escapeHTML(
                    user.name ||
                    "Oii User"
                  )}
                </div>

                <div class="user-card-email">
                  ${escapeHTML(
                    user.email ||
                    ""
                  )}
                </div>

              </div>

            `;


            div.addEventListener(
              "click",
              async () => {

                await startPrivateChat(
                  user
                );

              }
            );


            usersList.appendChild(
              div
            );

          }
        );


        if (count === 0) {

          usersList.innerHTML = `
            <div class="empty">
              வேறு Oii Chat users இன்னும் இல்லை 💙
            </div>
          `;

        }

      }

      catch (error) {

        console.error(
          "Users error:",
          error
        );

        usersList.innerHTML = `
          <div class="empty">
            Users load ஆகவில்லை 😕<br><br>
            ${error.message}
          </div>
        `;

      }

    }


    /* ================= START PRIVATE CHAT ================= */

    async function startPrivateChat(otherUser) {

      if (!currentUser) {
        return;
      }


      const chatId =
        makeChatId(
          currentUser.uid,
          otherUser.uid
        );


      const chatRef =
        doc(
          db,
          "chats",
          chatId
        );


      try {

        const existing =
          await getDoc(
            chatRef
          );


        if (!existing.exists()) {

          await setDoc(
            chatRef,
            {

              participants: [
                currentUser.uid,
                otherUser.uid
              ],

              createdAt:
                serverTimestamp(),

              updatedAt:
                serverTimestamp(),

              lastMessage:
                ""

            }
          );

        }


        usersModal.style.display =
          "none";


        openChat(
          chatId,
          otherUser
        );

      }

      catch (error) {

        console.error(error);

        alert(
          "Chat create failed 😕\n\n" +
          error.message
        );

      }

    }


    /* ================= OPEN CHAT ================= */

    function openChat(
      chatId,
      otherUser
    ) {

      currentChatId =
        chatId;

      currentChatUser =
        otherUser;


      chatUserName.textContent =
        otherUser.name ||
        "Oii User";


      chatUserPhoto.src =
        otherUser.photoURL ||
        "https://i.pravatar.cc/100";


      chatScreen.style.display =
        "block";


      messages.innerHTML = `
        <div class="empty">
          Loading messages... 💬
        </div>
      `;


      messageInput.value =
        "";

      messageInput.focus();


      if (unsubscribeMessages) {

        unsubscribeMessages();

      }


      const messagesRef =
        collection(
          db,
          "chats",
          chatId,
          "messages"
        );


      const messagesQuery =
        query(
          messagesRef,
          orderBy(
            "createdAt",
            "asc"
          )
        );


      unsubscribeMessages =
        onSnapshot(
          messagesQuery,
          (snapshot) => {

            messages.innerHTML =
              "";


            if (snapshot.empty) {

              messages.innerHTML = `
                <div class="empty">
                  Say Hi 👋
                </div>
              `;

              return;

            }


            snapshot.forEach(
              messageDoc => {

                const data =
                  messageDoc.data();


                renderMessage(
                  data
                );

              }
            );


            scrollMessages();

          },
          (error) => {

            console.error(
              "Messages error:",
              error
            );

            messages.innerHTML = `
              <div class="empty">
                Messages load ஆகவில்லை 😕<br><br>
                ${error.message}
              </div>
            `;

          }
        );

    }


    /* ================= RENDER MESSAGE ================= */

    function renderMessage(data) {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "message-row";


      const mine =
        currentUser &&
        data.senderId ===
        currentUser.uid;


      if (mine) {

        row.classList.add(
          "mine"
        );

      }


      const bubble =
        document.createElement(
          "div"
        );

      bubble.className =
        "message";


      const text =
        document.createElement(
          "div"
        );

      text.textContent =
        data.text ||
        "";


      const time =
        document.createElement(
          "span"
        );

      time.className =
        "message-time";

      time.textContent =
        formatTime(
          data.createdAt
        );


      bubble.appendChild(
        text
      );

      bubble.appendChild(
        time
      );


      row.appendChild(
        bubble
      );


      messages.appendChild(
        row
      );

    }


    /* ================= SEND MESSAGE ================= */

    async function sendMessage() {

      const text =
        messageInput.value.trim();


      if (
        !text ||
        !currentUser ||
        !currentChatId ||
        !currentChatUser
      ) {

        return;

      }


      messageInput.value =
        "";

      sendMessageBtn.disabled =
        true;


      try {

        const chatRef =
          doc(
            db,
            "chats",
            currentChatId
          );


        const chatSnap =
          await getDoc(
            chatRef
          );


        if (!chatSnap.exists()) {

          throw new Error(
            "Chat does not exist."
          );

        }


        const chatData =
          chatSnap.data();


        if (
          !chatData.participants.includes(
            currentUser.uid
          )
        ) {

          throw new Error(
            "You are not a participant in this chat."
          );

        }


        await addDoc(
          collection(
            db,
            "chats",
            currentChatId,
            "messages"
          ),
          {

            senderId:
              currentUser.uid,

            receiverId:
              currentChatUser.uid,

            text:
              text,

            createdAt:
              serverTimestamp()

          }
        );


        await setDoc(
          chatRef,
          {

            lastMessage:
              text,

            updatedAt:
              serverTimestamp()

          },
          {
            merge: true
          }
        );

      }

      catch (error) {

        console.error(
          "Send message error:",
          error
        );

        alert(
          "Message send failed 😕\n\n" +
          error.message
        );

      }

      finally {

        sendMessageBtn.disabled =
          false;

        messageInput.focus();

      }

    }


    /* ================= SCROLL ================= */

    function scrollMessages() {

      messages.scrollTop =
        messages.scrollHeight;

    }


    /* ================= ESCAPE HTML ================= */

    function escapeHTML(value) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        value == null
          ? ""
          : String(value);

      return div.innerHTML;

    }


    /* ================= NEW CHAT BUTTON ================= */

    newChatBtn.addEventListener(
      "click",
      () => {

        usersModal.style.display =
          "flex";

        loadUsers();

      }
    );


    /* ================= CLOSE MODAL ================= */

    closeUsersModal.addEventListener(
      "click",
      () => {

        usersModal.style.display =
          "none";

      }
    );


    usersModal.addEventListener(
      "click",
      (event) => {

        if (
          event.target ===
          usersModal
        ) {

          usersModal.style.display =
            "none";

        }

      }
    );


    /* ================= BACK CHAT ================= */

    backChatBtn.addEventListener(
      "click",
      () => {

        chatScreen.style.display =
          "none";

        currentChatId =
          null;

        currentChatUser =
          null;

        if (unsubscribeMessages) {

          unsubscribeMessages();

          unsubscribeMessages =
            null;

        }

      }
    );


    /* ================= SEND BUTTON ================= */

    sendMessageBtn.addEventListener(
      "click",
      sendMessage
    );


    /* ================= ENTER TO SEND ================= */

    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key ===
          "Enter"
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* ================= LOGOUT ================= */

    logoutBtn.addEventListener(
      "click",
      async () => {

        try {

          if (unsubscribeChats) {

            unsubscribeChats();

          }

          if (unsubscribeMessages) {

            unsubscribeMessages();

          }

          await signOut(
            auth
          );

        }

        catch (error) {

          console.error(
            error
          );

        }

      }
    );


    /* ================= TABS ================= */

    document
      .querySelectorAll(".tab")
      .forEach(tab => {

        tab.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".tab")
              .forEach(
                item =>
                  item.classList.remove(
                    "active"
                  )
              );

            tab.classList.add(
              "active"
            );

            const type =
              tab.dataset.tab;


            if (
              type === "groups"
            ) {

              chatList.innerHTML = `
                <div class="empty">
                  Groups coming soon 👥🔥
                </div>
              `;

            }

            else if (
              type === "channels"
            ) {

              chatList.innerHTML = `
                <div class="empty">
                  Channels coming soon 📢🔥
                </div>
              `;

            }

            else if (
              type === "unread"
            ) {

              chatList.innerHTML = `
                <div class="empty">
                  Unread system coming soon 🔵
                </div>
              `;

            }

            else {

              loadMyChats();

            }

          }
        );

      });


    /* ================= BOTTOM NAV ================= */

    document
      .querySelectorAll(".nav-item")
      .forEach(item => {

        item.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".nav-item")
              .forEach(
                nav =>
                  nav.classList.remove(
                    "active"
                  )
              );

            item.classList.add(
              "active"
            );

          }
        );

      });


    /* ================= SEARCH ================= */

    document
      .getElementById("searchBtn")
      .addEventListener(
        "click",
        () => {

          alert(
            "Search feature coming next 🔎💬"
          );

        }
      );


    /* ================= MORE ================= */

    document
      .getElementById("moreBtn")
      .addEventListener(
        "click",
        () => {

          alert(
            "Oii Chat Menu 💬\n\nMore features coming soon 🔥"
          );

        }
      );

  </script>

</body>
</html>
