<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Oii Chat 💬</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#050515;
  color:white;
  min-height:100vh;
}

button{font-family:inherit}

#loginScreen{
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top,rgba(0,212,255,.18),transparent 35%),
    radial-gradient(circle at bottom,rgba(255,0,127,.15),transparent 35%),
    #050515;
}

.login-box{
  width:100%;
  max-width:380px;
  padding:35px 25px;
  text-align:center;
  background:rgba(15,15,45,.88);
  border:1px solid rgba(0,212,255,.25);
  border-radius:25px;
  box-shadow:0 0 35px rgba(0,212,255,.12);
  backdrop-filter:blur(15px);
}

.login-logo{
  width:80px;
  height:80px;
  margin:0 auto 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:22px;
  font-size:42px;
  background:linear-gradient(45deg,#00d4ff,#ff007f);
}

.login-title{
  font-size:30px;
  font-weight:700;
  background:linear-gradient(45deg,#00d4ff,#ff007f);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.login-subtitle{
  color:#aaa;
  font-size:14px;
  margin:8px 0 28px;
}

#googleLoginBtn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:white;
  color:#222;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}

#googleLoginBtn i{
  color:#4285F4;
  font-size:20px;
}

#loginError{
  display:none;
  margin-top:15px;
  color:#ff668f;
  font-size:12px;
}

#appScreen{
  display:none;
}

.app-container{
  width:100%;
  max-width:450px;
  min-height:100vh;
  margin:auto;
  background:#080820;
  position:relative;
  padding-bottom:80px;
  border-left:1px solid rgba(0,212,255,.2);
  border-right:1px solid rgba(0,212,255,.2);
}

.header{
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(10,10,35,.95);
  position:sticky;
  top:0;
  z-index:100;
}

.logo-text{
  font-size:20px;
  font-weight:700;
  background:linear-gradient(45deg,#00d4ff,#ff007f);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.header-icons{
  display:flex;
  gap:18px;
  color:#00d4ff;
  font-size:18px;
}

.header-icons i{
  cursor:pointer;
}

.user-profile{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 20px 8px;
}

.user-profile img{
  width:45px;
  height:45px;
  border-radius:50%;
  border:2px solid #00d4ff;
  object-fit:cover;
}

.user-details{
  flex:1;
  min-width:0;
}

.user-name{
  font-size:14px;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.user-email{
  margin-top:2px;
  font-size:10px;
  color:#777;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.logout-btn{
  background:rgba(255,0,127,.12);
  color:#ff4f9a;
  border:1px solid rgba(255,0,127,.25);
  border-radius:10px;
  padding:7px 10px;
  cursor:pointer;
  font-size:11px;
}

/* STORIES */

.stories-container{
  display:flex;
  gap:15px;
  padding:15px 20px;
  overflow-x:auto;
  scrollbar-width:none;
}

.stories-container::-webkit-scrollbar{
  display:none;
}

.story{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  font-size:12px;
  flex-shrink:0;
}

.story-avatar{
  width:60px;
  height:60px;
  padding:3px;
  border-radius:50%;
  background:linear-gradient(45deg,#00d4ff,#ff007f);
  position:relative;
}

.story-avatar img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #080820;
}

.add-story{
  position:absolute;
  bottom:0;
  right:0;
  width:18px;
  height:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#00d4ff;
  color:black;
  font-size:12px;
  font-weight:bold;
}

/* TABS */

.tabs{
  display:flex;
  gap:10px;
  padding:10px 20px;
  overflow-x:auto;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  padding:7px 16px;
  border-radius:20px;
  font-size:13px;
  white-space:nowrap;
  background:rgba(255,255,255,.05);
  color:#aaa;
  border:1px solid rgba(255,255,255,.1);
  cursor:pointer;
  position:relative;
}

.tab.active{
  background:linear-gradient(45deg,#00d4ff,#ff007f);
  color:white;
  font-weight:600;
  border:none;
}

.unread-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:18px;
  height:18px;
  margin-left:5px;
  padding:0 5px;
  border-radius:10px;
  background:#ff3b81;
  color:white;
  font-size:10px;
  font-weight:700;
}

/* CHAT LIST */

.chat-list{
  padding:10px 20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.chat-card{
  display:flex;
  align-items:center;
  gap:15px;
  padding:12px;
  background:rgba(20,20,50,.6);
  border-radius:16px;
  border:1px solid rgba(0,212,255,.2);
  cursor:pointer;
  transition:.2s;
}

.chat-card:hover{
  border-color:rgba(0,212,255,.5);
  transform:translateY(-1px);
}

.avatar{
  width:50px;
  height:50px;
  flex-shrink:0;
  border-radius:50%;
  border:2px solid #ff007f;
  position:relative;
}

.avatar img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
}

.online-dot{
  position:absolute;
  right:-1px;
  bottom:0;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#00ff66;
  border:2px solid #080820;
}

.offline-dot{
  position:absolute;
  right:-1px;
  bottom:0;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#555;
  border:2px solid #080820;
}

.chat-info{
  flex:1;
  min-width:0;
}

.chat-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:4px;
}

.chat-name{
  font-weight:600;
  font-size:15px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chat-time{
  font-size:10px;
  color:#888;
  white-space:nowrap;
}

.chat-msg{
  font-size:13px;
  color:#aaa;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.unread-count{
  min-width:20px;
  height:20px;
  padding:0 6px;
  border-radius:50%;
  background:#ff007f;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:700;
  margin-left:5px;
}

.chat-card.has-unread .chat-msg{
  color:white;
  font-weight:600;
}

.empty{
  text-align:center;
  color:#777;
  padding:40px 20px;
  font-size:13px;
}

/* FAB */

.fab{
  position:fixed;
  bottom:80px;
  right:max(20px,calc((100vw - 450px)/2 + 20px));
  width:55px;
  height:55px;
  border:none;
  border-radius:50%;
  background:linear-gradient(45deg,#00d4ff,#ff007f);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  box-shadow:0 0 15px rgba(0,212,255,.5);
  cursor:pointer;
  z-index:90;
}

/* NAV */

.nav{
  position:fixed;
  bottom:0;
  width:100%;
  max-width:450px;
  height:65px;
  background:rgba(10,10,35,.97);
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid rgba(255,255,255,.1);
  z-index:100;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-size:10px;
  color:#666;
  cursor:pointer;
}

.nav-item.active{
  color:#00d4ff;
}

.nav-item i{
  font-size:18px;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:500;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-box{
  width:100%;
  max-width:400px;
  max-height:80vh;
  overflow:hidden;
  background:#10102d;
  border:1px solid rgba(0,212,255,.25);
  border-radius:22px;
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 20px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.modal-header h3{
  font-size:18px;
}

.close-btn{
  background:none;
  border:none;
  color:#aaa;
  font-size:20px;
  cursor:pointer;
}

.users-list{
  padding:10px;
  max-height:60vh;
  overflow-y:auto;
}

.user-card{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border-radius:14px;
  cursor:pointer;
}

.user-card:hover{
  background:rgba(255,255,255,.06);
}

.user-card img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #00d4ff;
}

.user-card-info{
  flex:1;
  min-width:0;
}

.user-card-name{
  font-size:14px;
  font-weight:600;
}

.user-card-email{
  color:#777;
  font-size:10px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* CHAT SCREEN */

#chatScreen{
  display:none;
  position:fixed;
  inset:0;
  background:#080820;
  z-index:300;
}

.chat-page{
  width:100%;
  max-width:450px;
  height:100%;
  margin:auto;
  display:flex;
  flex-direction:column;
  background:#080820;
}

.chat-header{
  height:65px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 15px;
  background:#0d0d2b;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.back-btn{
  width:35px;
  height:35px;
  border:none;
  background:none;
  color:white;
  font-size:20px;
  cursor:pointer;
}

.chat-header img{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
}

.chat-header-info{
  flex:1;
  min-width:0;
}

.chat-header-name{
  font-size:14px;
  font-weight:600;
}

.chat-header-status{
  color:#00ff66;
  font-size:10px;
}

/* MESSAGES */

.messages{
  flex:1;
  overflow-y:auto;
  padding:20px 15px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.message-row{
  display:flex;
  width:100%;
}

.message-row.mine{
  justify-content:flex-end;
}

.message{
  max-width:75%;
  padding:9px 12px;
  border-radius:15px;
  font-size:13px;
  word-wrap:break-word;
  background:#1b1b42;
}

.message-row.mine .message{
  background:linear-gradient(45deg,#007ea0,#a90055);
}

.message-meta{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:3px;
  margin-top:3px;
}

.message-time{
  font-size:8px;
  color:rgba(255,255,255,.55);
}

.message-status{
  font-size:10px;
  line-height:1;
}

.message-input-area{
  display:flex;
  gap:8px;
  padding:10px;
  background:#0d0d2b;
  border-top:1px solid rgba(255,255,255,.08);
}

#messageInput{
  flex:1;
  min-width:0;
  border:1px solid rgba(0,212,255,.2);
  outline:none;
  border-radius:22px;
  padding:11px 15px;
  background:#151535;
  color:white;
  font-size:13px;
}

#messageInput::placeholder{
  color:#777;
}

#sendMessageBtn{
  width:45px;
  height:45px;
  flex-shrink:0;
  border:none;
  border-radius:50%;
  background:linear-gradient(45deg,#00d4ff,#ff007f);
  color:white;
  cursor:pointer;
}

#sendMessageBtn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

@media(max-width:450px){

  .app-container{
    border:none;
  }

  .nav{
    max-width:100%;
  }

  .fab{
    right:20px;
  }

}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

    <div class="login-logo">
      💬
    </div>

    <div class="login-title">
      Oii Chat
    </div>

    <div class="login-subtitle">
      Tamil First Chat App 💙
    </div>

    <button id="googleLoginBtn">
      <i class="fab fa-google"></i>

    </button>

    <div id="loginError"></div>

  </div>

</div>


<!-- APP -->

<div id="appScreen">

  <div class="app-container">

    <div class="header">

      <div class="logo-text">

      </div>

      <div class="header-icons">

        <i class="fas fa-search"

        <i class="fas fa-ellipsis-v"

      </button>

    </div>


    <!-- STORIES -->

    <div class="stories-container">

      <div class="story">

        <div class="story-avatar">

          <img id="myStoryPhoto"

      </div>

    </div>


    <!-- TABS -->

    <div class="tabs">

    </div>

    <div class="chat-list"
         id="chatList">

      <div class="empty">

      </div>

    </div>


    <!-- FAB -->

    <button class="fab"
            id="newChatBtn">

      <i class="fas fa-plus"></i>

    </button>


    <!-- NAV -->

    <div class="nav">

      <div class="nav-item active">

        <i class="fas fa-comment-dots"></i>

        <span>
          Chats
        </span>

      </div>

      <div class="nav-item">

        <i class="fas fa-phone-alt"></i>

        <span>
          Calls
        </span>

      </div>

      <div class="nav-item">

        <i class="fas fa-circle-notch"></i>

        <span>
          Status
        </span>

      </div>

      <div class="nav-item">

        <i class="fas fa-users"></i>

        <span>
          Communities
        </span>

      </div>

      <div class="nav-item">

        <i class="fas fa-cog"></i>

        <span>
          Settings
        </span>

      </div>

    </div>

  </div>

</div>


<!-- USERS MODAL -->

<div class="modal"
     id="usersModal">

  <div class="modal-box">

    <div class="modal-header">

      <h3>
        New Chat 💬
      </h3>

      <button class="close-btn"
              id="closeUsersModal">
        ×
      </button>

    </div>

    <div class="users-list"
         id="usersList">

      <div class="empty">
        Loading Oii Chat users...
      </div>

    </div>

  </div>

</div>


<!-- CHAT -->

<div id="chatScreen">

  <div class="chat-page">

    <div class="chat-header">

      <button class="back-btn"
              id="backChatBtn">

        <i class="fas fa-arrow-left"></i>

      </button>

      <img id="chatUserPhoto"
           src="https://i.pravatar.cc/100">

      <div class="chat-header-info">

        <div class="chat-header-name"
             id="chatUserName">
          User
        </div>

        <div class="chat-header-status"
             id="chatUserStatus">
          🫣 Offline
        </div>

      </div>

    </div>


    <div class="messages"
         id="messages">
    </div>


    <div class="message-input-area">

      <input type="text"
             id="messageInput"
             placeholder="Type a message..."
             autocomplete="off">

      <button id="sendMessageBtn">

        <i class="fas fa-paper-plane"></i>

      </button>

    </div>

  </div>

</div>

  return [uid1,uid2]
    .sort()
    .join("_");

}


/* =========================
   TIME
========================= */

function formatTime(timestamp){

  if(!timestamp)
    return "";

  const date =
    timestamp.toDate
      ? timestamp.toDate()
      : new Date(timestamp);

  return date.toLocaleTimeString(
    [],
    {
      hour:"numeric",
      minute:"2-digit"
    }
  );

}


/* =========================
   ONLINE CHECK
========================= */

function isUserOnline(user){

  if(!user)
    return false;

  if(user.online !== true)
    return false;

  if(!user.lastSeen)
    return false;

  const lastSeen =
    user.lastSeen.toMillis
      ? user.lastSeen.toMillis()
      : new Date(user.lastSeen).getTime();

  return (
    Date.now() - lastSeen
    < ONLINE_TIMEOUT
  );

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHTML(value){

  const div =
    document.createElement("div");

  div.textContent =
    value == null
      ? ""
      : String(value);

  return div.innerHTML;

}

/* =========================
   DELIVERY LISTENER
========================= */

function stopDeliveryListener(chatId){

  const unsubscribe =
    deliveryListeners.get(chatId);

  if(unsubscribe){

    unsubscribe();

    deliveryListeners.delete(chatId);

  }

}


/*
  Listen to messages in a chat.

  When a message sent to the current user
  arrives with "sent" status, change it to
  "delivered".

  If the chat is currently open, it becomes
  "read" immediately.
*/

function startDeliveryListener(
  chatId
){

  if(!currentUser)
    return;

  if(deliveryListeners.has(chatId))
    return;

  const messagesRef =
    collection(
      db,
      "chats",
      chatId,
      "messages"
    );

  const messagesQuery =
    query(
      messagesRef,
      orderBy(
        "createdAt",
        "asc"
      )
    );

  const unsubscribe =
    onSnapshot(
      messagesQuery,
      async(snapshot)=>{

        const updates = [];

        snapshot.forEach(
          messageDoc=>{

            const data =
              messageDoc.data();

            /*
              Only messages received by
              current user are handled.
            */
            if(
              data.receiverId !==
              currentUser.uid
            ){

              return;

            }

            /*
              If current chat is open,
              mark incoming message as READ.
            */
            if(
              currentChatId === chatId &&
              chatScreen.style.display === "block"
            ){

              if(
                data.status === "sent" ||
                data.status === "delivered"
              ){

                updates.push(
                  updateDoc(
                    messageDoc.ref,
                    {
                      status:"read"
                    }
                  )
                );

              }

            }

            /*
              If chat is not open, message is
              delivered but not read.
            */
            else if(
              data.status === "sent"
            ){

              updates.push(
                updateDoc(
                  messageDoc.ref,
                  {
                    status:"delivered"
                  }
                )
              );

            }

          }
        );

        if(updates.length){

          try{

            await Promise.all(
              updates
            );

          }catch(error){

            console.error(
              "Delivery/read update error:",
              error
            );

          }

        }

      },
      error=>{

        console.error(
          "Delivery listener error:",
          error
        );

      }
    );

  deliveryListeners.set(
    chatId,
    unsubscribe
  );

}

    }
  );

  deliveryListeners.clear();

}

/* =========================
   LOAD CHATS
========================= */

function loadMyChats(){

  if(!currentUser)
    return;

  const chatsRef =
    collection(
      db,
      "chats"
    );

  const chatsQuery =
    query(
      chatsRef,
      where(
        "participants",
        "array-contains",
        currentUser.uid
      )
    );

  if(unsubscribeChats)
    unsubscribeChats();

  unsubscribeChats =
    onSnapshot(
      chatsQuery,
      async(snapshot)=>{

        allChats=[];

        for(
          const chatDoc
          of snapshot.docs
        ){

          const data =
            chatDoc.data();

          const otherUid =
            data.participants.find(
              uid =>
                uid !==
                currentUser.uid
            );

          if(!otherUid)
            continue;

          try{

            const userSnap =
              await getDoc(
                doc(
                  db,
                  "users",
                  otherUid
                )
              );

            if(userSnap.exists()){

              const otherUser =
                userSnap.data();

              allChats.push({

                id:
                  chatDoc.id,

                user:
                  otherUser,

                lastMessage:
                  data.lastMessage ||
                  "",

                updatedAt:
                  data.updatedAt ||
                  null,

                unread:
                  data.unread?.[
                    currentUser.uid
                  ] || 0

              });

            }

          }catch(error){

            console.error(error);

          }

        }

        renderAllChats();

        /*
          Start a realtime listener for every
          private chat so incoming messages
          can become 💓 Delivered.
        */
        startAllDeliveryListeners();

      },
      error=>{

        console.error(error);

        chatList.innerHTML=`

          <div class="empty">

            Unable to load chats 😕<br><br>

            ${escapeHTML(
              error.message
            )}

          </div>

        `;

      }
    );

}


/* =========================
   RENDER CHATS
========================= */

function renderAllChats(){

  chatList.innerHTML="";

  const totalUnread =
    allChats.reduce(
      (sum,chat)=>
        sum +
        (chat.unread || 0),
      0
    );

  if(totalUnread>0){

    unreadTabBadge.style.display =
      "inline-flex";

    unreadTabBadge.textContent =
      totalUnread>99
        ? "99+"
        : totalUnread;

  }else{

    unreadTabBadge.style.display =
      "none";

  }

  const activeTab =
    document
      .querySelector(".tab.active")
      ?.dataset.tab ||
    "all";

  let chats =
    [...allChats];

  if(activeTab==="unread"){

    chats =
      chats.filter(
        chat =>
          (chat.unread || 0)>0
      );

  }

  if(
    activeTab==="groups" ||
    activeTab==="channels"
  ){

    return;

  }

  chats.sort(
    (a,b)=>{

      const aTime =
        a.updatedAt?.toMillis
          ? a.updatedAt.toMillis()
          : 0;

      const bTime =
        b.updatedAt?.toMillis
          ? b.updatedAt.toMillis()
          : 0;

      return bTime-aTime;

    }
  );

  if(chats.length===0){

    chatList.innerHTML=`

      <div class="empty">

        ${
          activeTab==="unread"
            ? "😢 No unread messages"
            : "No chats yet 💬<br><br>Tap + to start a new chat."
        }

      </div>

    `;

    return;

  }

  chats.forEach(
    chat =>
      renderChatCard(chat)
  );

}

   START PRIVATE CHAT
========================= */

async function startPrivateChat(
  otherUser
){

  if(!currentUser)
    return;

  const chatId =
    makeChatId(
      currentUser.uid,
      otherUser.uid
    );

  const chatRef =
    doc(
      db,
      "chats",
      chatId
    );

  try{

    const existing =
      await getDoc(
        chatRef
      );

    if(!existing.exists()){

      await setDoc(
        chatRef,
        {

          participants:[
            currentUser.uid,
            otherUser.uid
          ],

          createdAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp(),

          lastMessage:
            "",

          unread:{

            [currentUser.uid]:
              0,

            [otherUser.uid]:
              0

          }

        }
      );

    }

    usersModal.style.display =
      "none";

    /*
      Start delivery listener immediately
      for newly created chat.
    */
    startDeliveryListener(
      chatId
    );

    openChat(
      chatId,
      otherUser
    );

  }catch(error){

    console.error(error);

    alert(
      "Chat create failed 😕\n\n" +
      error.message
    );

  }

}

async function markChatMessagesRead(
  chatId
){

  try{

    const messagesRef =
      collection(
        db,
        "chats",
        chatId,
        "messages"
      );

    const messagesQuery =
      query(
        messagesRef,
        orderBy(
          "createdAt",
          "asc"
        )

    const snapshot =
      await getDocs(
        messagesQuery
      );

    snapshot.forEach(
      messageDoc=>{

        if(

          )

              }
            )
          );

        }

      }
    );

      );

    }

  }catch(error){

      "Read status error:",
      error
    );

  }

}


/* =========================
   OPEN CHAT
========================= */

async function openChat(
  chatId,
  otherUser
){

  currentChatId =
    chatId;

  currentChatUser =
    otherUser;

  chatUserName.textContent =
    otherUser.name ||
    "Oii User";

  chatUserPhoto.src =
    otherUser.photoURL ||
    "https://i.pravatar.cc/100";

  updateChatStatus(
    otherUser
  );

  chatScreen.style.display =
    "block";

  messages.innerHTML=`

    <div class="empty">
      Loading messages... 💬
    </div>

  `;

  messageInput.value =
    "";

  /*
    Clear unread count.
  */

  try{

    await updateDoc(
      doc(
        db,
        "chats",
        chatId
      ),
      {
        [`unread.${currentUser.uid}`]:
          0
      }
    );

  }catch(error){

    console.error(
      "Unread clear error:",
      error
    );

  }


  /*
    Start delivery listener.
  */

  startDeliveryListener(
    chatId
  );


  /*
    Stop previous user status listener.
  */

  if(unsubscribeUserStatus){

    unsubscribeUserStatus();

    unsubscribeUserStatus =
      null;

  }


  /*
    Listen to other user's online status.
  */

  unsubscribeUserStatus =
    onSnapshot(
      doc(
        db,
        "users",
        otherUser.uid
      ),
      snapshot=>{

        if(!snapshot.exists())
          return;

        const freshUser =
          snapshot.data();

        currentChatUser = {

          ...freshUser,

          uid:
            otherUser.uid

        };

        updateChatStatus(
          currentChatUser
        );

      }
    );


  /*
    Stop previous message listener.
  */

  if(unsubscribeMessages)
    unsubscribeMessages();


  const messagesRef =
    collection(
      db,
      "chats",
      chatId,
      "messages"
    );


  const messagesQuery =
    query(
      messagesRef,
      orderBy(
        "createdAt",
        "asc"
      )
    );


  unsubscribeMessages =
    onSnapshot(
      messagesQuery,
      snapshot=>{

        messages.innerHTML =
          "";

        if(snapshot.empty){

          messages.innerHTML=`

            <div class="empty">
              Say Hi 👋
            </div>

          `;

          return;

        }

        snapshot.forEach(
          messageDoc=>{

            renderMessage(
              messageDoc.data()
            );

          }
        );

        scrollMessages();

        /*
          Chat is open, so incoming
          messages are READ.
        */

        markChatMessagesRead(
          chatId
        );

      },
      error=>{

        console.error(error);

        messages.innerHTML=`

          <div class="empty">

            Messages load ஆகவில்லை 😕<br><br>

            ${escapeHTML(
              error.message
            )}

          </div>

        `;

      }
    );


  setTimeout(
    ()=>{

      messageInput.focus();

    },
    100
  );

}


/* =========================
   MESSAGE STATUS
========================= */

function getMessageStatusIcon(
  status
){

  if(status === "read"){

    return "💞";

  }

  if(status === "delivered"){

    return "💓";

  }

  return "🚀";

}


/* =========================
   RENDER MESSAGE
========================= */

function renderMessage(data){

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "message-row";

  const mine =
    currentUser &&
    data.senderId ===
    currentUser.uid;

  if(mine)
    row.classList.add(
      "mine"
    );


  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "message";


  const text =
    document.createElement(
      "div"
    );

  text.textContent =
    data.text || "";


  const meta =
    document.createElement(
      "div"
    );

  meta.className =
    "message-meta";


  const time =
    document.createElement(
      "span"
    );

  time.className =
    "message-time";

  time.textContent =
    formatTime(
      data.createdAt
    );


  meta.appendChild(
    time
  );


  /*
    Status icon is shown only
    on messages sent by me.
  */

  if(mine){

    const status =
      document.createElement(
        "span"
      );

    status.className =
      "message-status";

    status.textContent =
      getMessageStatusIcon(
        data.status
      );

    meta.appendChild(
      status
    );

  }


  bubble.appendChild(
    text
  );

  bubble.appendChild(
    meta
  );

  row.appendChild(
    bubble
  );

  messages.appendChild(
    row
  );

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  const text =
    messageInput.value.trim();

  if(
    !text ||
    !currentUser ||
    !currentChatId ||
    !currentChatUser
  ){

    return;

  }

  messageInput.value =
    "";

  sendMessageBtn.disabled =
    true;


  try{

    const chatRef =
      doc(
        db,
        "chats",
        currentChatId
      );


    const chatSnap =
      await getDoc(
        chatRef
      );


    if(!chatSnap.exists()){

      throw new Error(
        "Chat does not exist."
      );

    }


    const chatData =
      chatSnap.data();


    if(
      !chatData.participants.includes(
        currentUser.uid
      )
    ){

      throw new Error(
        "You are not a participant in this chat."
      );

    }


    /*
      Create message with SENT status.
    */

    await addDoc(
      collection(
        db,
        "chats",
        currentChatId,
        "messages"
      ),
      {

        senderId:
          currentUser.uid,

        receiverId:
          currentChatUser.uid,

        text:
          text,

        createdAt:
          serverTimestamp(),

        status:
          "sent"

      }
    );


    /*
      Update chat preview and unread count.
    */

    const oldUnread =
      chatData.unread?.[
        currentChatUser.uid
      ] || 0;


    await setDoc(
      chatRef,
      {

        lastMessage:
          text,

        updatedAt:
          serverTimestamp(),

        [`unread.${currentChatUser.uid}`]:
          oldUnread + 1,

        [`unread.${currentUser.uid}`]:
          0

      },
      {
        merge:true
      }
    );


  }catch(error){

    console.error(error);

    /*
      Put message back if sending failed.
    */

    messageInput.value =
      text;

    alert(
      "Message send failed 😕\n\n" +
      error.message
    );

  }finally{

    sendMessageBtn.disabled =
      false;

    messageInput.focus();

  }

}

}

);

  }
);


/* =========================
   BACK CHAT
========================= */

backChatBtn.addEventListener(
  "click",
  ()=>{

    chatScreen.style.display =
      "none";

    currentChatId =
      null;

    currentChatUser =
      null;


    if(unsubscribeMessages){

      unsubscribeMessages();

      unsubscribeMessages =
        null;

    }


    if(unsubscribeUserStatus){

      unsubscribeUserStatus();

      unsubscribeUserStatus =
        null;

    }

  }
);


/* =========================
   SEND
========================= */

sendMessageBtn.addEventListener(
  "click",
  sendMessage
);


/* =========================
   ENTER
========================= */

messageInput.addEventListener(
  "keydown",
  event=>{

    if(event.key === "Enter"){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
  "click",
  async()=>{

    try{

      await setUserOffline();

      stopOnlineHeartbeat();

      stopAllDeliveryListeners();


      if(unsubscribeChats){

        unsubscribeChats();

        unsubscribeChats =
          null;

      }


      if(unsubscribeMessages){

        unsubscribeMessages();

        unsubscribeMessages =
          null;

      }


      if(unsubscribeUserStatus){

        unsubscribeUserStatus();

        unsubscribeUserStatus =
          null;

      }


      await signOut(
        auth
      );

    }catch(error){

      console.error(
        error
      );

    }

  }
);


/* =========================
   TABS
========================= */

document
  .querySelectorAll(".tab")
  .forEach(tab=>{

    tab.addEventListener(
      "click",
      ()=>{

        document
          .querySelectorAll(".tab")
          .forEach(item=>
            item.classList.remove(
              "active"
            )
          );

        tab.classList.add(
          "active"
        );

        const type =
          tab.dataset.tab;


        if(type === "groups"){

          chatList.innerHTML=`

            <div class="empty">
              Groups coming soon 👥🔥
            </div>

          `;

        }else if(type === "channels"){

          chatList.innerHTML=`

            <div class="empty">
              Channels coming soon 📢🔥
            </div>

          `;

        }else{

          renderAllChats();

        }

      }
    );

  });
