<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Oii Chat 💬</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{background:#050515;color:#fff;min-height:100vh}
button{font-family:inherit}
#loginScreen{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at top,rgba(0,212,255,.18),transparent 35%),#050515}
.login-box{width:100%;max-width:380px;padding:35px 25px;text-align:center;background:#10102de0;border:1px solid #00d4ff40;border-radius:25px}
.login-logo{width:80px;height:80px;margin:auto auto 18px;display:flex;align-items:center;justify-content:center;border-radius:22px;font-size:42px;background:linear-gradient(45deg,#00d4ff,#ff007f)}
.login-title{font-size:30px;font-weight:700;background:linear-gradient(45deg,#00d4ff,#ff007f);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-subtitle{color:#aaa;font-size:14px;margin:8px 0 28px}
#googleLoginBtn{width:100%;padding:14px;border:0;border-radius:14px;background:#fff;color:#222;font-size:15px;font-weight:600;cursor:pointer}
#googleLoginBtn i{color:#4285f4;margin-right:10px}
#loginError{display:none;margin-top:15px;color:#ff668f;font-size:12px}

#appScreen{display:none}
.app-container{width:100%;max-width:450px;min-height:100vh;margin:auto;background:#080820;position:relative;padding-bottom:80px}
.header{padding:15px 20px;display:flex;justify-content:space-between;align-items:center;background:#0a0a23f5;position:sticky;top:0;z-index:100}
.logo-text{font-size:20px;font-weight:700;background:linear-gradient(45deg,#00d4ff,#ff007f);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-icons{display:flex;gap:18px;color:#00d4ff;font-size:18px}
.header-icons i{cursor:pointer}
.user-profile{display:flex;align-items:center;gap:10px;padding:14px 20px 8px}
.user-profile img{width:45px;height:45px;border-radius:50%;border:2px solid #00d4ff;object-fit:cover}
.user-details{flex:1;min-width:0}
.user-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-email{font-size:10px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logout-btn{background:#ff007f20;color:#ff4f9a;border:1px solid #ff007f40;border-radius:10px;padding:7px 10px;cursor:pointer;font-size:11px}

.stories-container{display:flex;gap:15px;padding:15px 20px;overflow-x:auto}
.story{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px}
.story-avatar{width:60px;height:60px;padding:3px;border-radius:50%;background:linear-gradient(45deg,#00d4ff,#ff007f)}
.story-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #080820}
.tabs{display:flex;gap:10px;padding:10px 20px;overflow-x:auto}
.tab{padding:7px 16px;border-radius:20px;font-size:13px;white-space:nowrap;background:#ffffff0d;color:#aaa;border:1px solid #ffffff1a;cursor:pointer}
.tab.active{background:linear-gradient(45deg,#00d4ff,#ff007f);color:#fff;font-weight:600;border:0}
.unread-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;margin-left:5px;padding:0 5px;border-radius:10px;background:#ff3b81;color:#fff;font-size:10px}
.chat-list{padding:10px 20px;display:flex;flex-direction:column;gap:12px}
.chat-card{display:flex;align-items:center;gap:15px;padding:12px;background:#14143299;border-radius:16px;border:1px solid #00d4ff33;cursor:pointer}
.chat-card.has-unread .chat-msg{color:#fff;font-weight:600}
.avatar{width:50px;height:50px;flex-shrink:0;border-radius:50%;border:2px solid #ff007f;position:relative}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.online-dot,.offline-dot{position:absolute;right:-1px;bottom:0;width:14px;height:14px;border-radius:50%;border:2px solid #080820}
.online-dot{background:#00ff66}.offline-dot{background:#555}
.chat-info{flex:1;min-width:0}
.chat-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px}
.chat-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:10px;color:#888;white-space:nowrap}
.chat-msg{font-size:13px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread-count{min-width:20px;height:20px;padding:0 6px;border-radius:50%;background:#ff007f;display:flex;align-items:center;justify-content:center;font-size:10px}
.empty{text-align:center;color:#777;padding:40px 20px;font-size:13px}

.fab{position:fixed;bottom:80px;right:max(20px,calc((100vw - 450px)/2 + 20px));width:55px;height:55px;border:0;border-radius:50%;background:linear-gradient(45deg,#00d4ff,#ff007f);color:#fff;font-size:22px;cursor:pointer;z-index:90}
.nav{position:fixed;bottom:0;width:100%;max-width:450px;height:65px;background:#0a0a23f7;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #ffffff1a;z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#666;cursor:pointer}
.nav-item.active{color:#00d4ff}.nav-item i{font-size:18px}

.modal{display:none;position:fixed;inset:0;background:#000000bf;z-index:500;align-items:center;justify-content:center;padding:20px}
.modal-box{width:100%;max-width:400px;max-height:80vh;overflow:hidden;background:#10102d;border:1px solid #00d4ff40;border-radius:22px}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #ffffff14}
.modal-header h3{font-size:18px}
.close-btn{background:0;border:0;color:#aaa;font-size:20px;cursor:pointer}
.users-list{padding:10px;max-height:60vh;overflow-y:auto}
.user-card,.blocked-user{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px}
.user-card img,.blocked-user img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #00d4ff}
.user-card-info,.blocked-info{flex:1;min-width:0}
.user-card-name,.blocked-name{font-size:14px;font-weight:600}
.user-card-email,.blocked-email{font-size:10px;color:#777}
.unblock-small{border:1px solid #00ff994d;background:#00ff991a;color:#00ff99;border-radius:10px;padding:7px 10px;font-size:10px;cursor:pointer}

#chatScreen{display:none;position:fixed;inset:0;background:#080820;z-index:300}
.chat-page{width:100%;max-width:450px;height:100%;margin:auto;display:flex;flex-direction:column;background:#080820}
.chat-header{height:65px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:10px 15px;background:#0d0d2b;border-bottom:1px solid #ffffff14}
.back-btn{width:35px;height:35px;border:0;background:0;color:#fff;font-size:20px}
.chat-header img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.chat-header-info{flex:1;min-width:0}
.chat-header-name{font-size:14px;font-weight:600}
.chat-header-status{color:#888;font-size:10px}
.chat-more-btn{width:38px;height:38px;border:0;border-radius:50%;background:#ffffff0f;color:#fff;font-size:17px}
.messages{flex:1;overflow-y:auto;padding:20px 15px;display:flex;flex-direction:column;gap:8px}
.message-row{display:flex;width:100%}.message-row.mine{justify-content:flex-end}
.message{max-width:75%;padding:9px 12px;border-radius:15px;font-size:13px;word-wrap:break-word;background:#1b1b42}
.message-row.mine .message{background:linear-gradient(45deg,#007ea0,#a90055)}
.message-meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:3px}
.message-time{font-size:8px;color:#ffffff8c}.message-status{font-size:11px}
.typing-indicator{display:none;padding:4px 15px 7px;color:#00d4ff;font-size:10px;font-style:italic}
.message-input-area{display:flex;gap:8px;padding:10px;background:#0d0d2b;border-top:1px solid #ffffff14}
#messageInput{flex:1;min-width:0;border:1px solid #00d4ff33;outline:0;border-radius:22px;padding:11px 15px;background:#151535;color:#fff;font-size:13px}
#sendMessageBtn{width:45px;height:45px;flex-shrink:0;border:0;border-radius:50%;background:linear-gradient(45deg,#00d4ff,#ff007f);color:#fff}
#sendMessageBtn:disabled{opacity:.6}

.chat-action-menu{display:none;position:fixed;inset:0;background:#000000b3;z-index:700;align-items:flex-end;justify-content:center}
.chat-action-box{width:100%;max-width:450px;background:#10102d;border-radius:22px 22px 0 0;padding:10px 10px 20px}
.chat-action-title{text-align:center;color:#777;font-size:11px;padding:10px}
.chat-action{width:100%;padding:15px;border:0;background:0;color:#fff;text-align:left;font-size:14px;border-radius:12px}
.chat-action.delete,.chat-action.block{color:#ff6688}
.chat-action.unblock{color:#00ff99}
.chat-action.cancel{color:#00d4ff;text-align:center}

@media(max-width:450px){
 .app-container{border:0}.nav{max-width:100%}.fab{right:20px}
}
</style>
</head>

<body>

<div id="loginScreen">
 <div class="login-box">
  <div class="login-logo">💬</div>
  <div class="login-title">Oii Chat</div>
  <div class="login-subtitle">Tamil First Chat App 💙</div>
  <button id="googleLoginBtn"><i class="fab fa-google"></i> Continue with Google</button>
  <div id="loginError"></div>
 </div>
</div>

<div id="appScreen">
 <div class="app-container">

  <div class="header">
   <div class="logo-text">Oii Chat 💬</div>
   <div class="header-icons">
    <i class="fas fa-search" id="searchBtn"></i>
    <i class="fas fa-ellipsis-v" id="moreBtn"></i>
   </div>
  </div>

  <div class="user-profile">
   <img id="userPhoto" src="https://i.pravatar.cc/100">
   <div class="user-details">
    <div class="user-name" id="userName">Oii User</div>
    <div class="user-email" id="userEmail">Loading...</div>
   </div>
   <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>

  <div class="stories-container">
   <div class="story">
    <div class="story-avatar">
     <img id="myStoryPhoto" src="https://i.pravatar.cc/100">
    </div>
    <span>My Story</span>
   </div>
  </div>

  <div class="tabs">
   <div class="tab active" data-tab="all">All Chats</div>
   <div class="tab" data-tab="unread">Unread <span id="unreadTabBadge" class="unread-badge" style="display:none">0</span></div>
   <div class="tab" data-tab="groups">Groups</div>
   <div class="tab" data-tab="channels">Channels</div>
  </div>

  <div class="chat-list" id="chatList">
   <div class="empty">Loading chats... 💬</div>
  </div>

  <button class="fab" id="newChatBtn"><i class="fas fa-plus"></i></button>

  <div class="nav">
   <div class="nav-item active"><i class="fas fa-comment-dots"></i><span>Chats</span></div>
   <div class="nav-item"><i class="fas fa-phone-alt"></i><span>Calls</span></div>
   <div class="nav-item"><i class="fas fa-circle-notch"></i><span>Status</span></div>
   <div class="nav-item"><i class="fas fa-users"></i><span>Communities</span></div>
   <div class="nav-item"><i class="fas fa-cog"></i><span>Settings</span></div>
  </div>
 </div>
</div>

<div class="modal" id="usersModal">
 <div class="modal-box">
  <div class="modal-header">
   <h3>New Chat 💬</h3>
   <button class="close-btn" id="closeUsersModal">×</button>
  </div>
  <div class="users-list" id="usersList"><div class="empty">Loading Oii Chat users...</div></div>
 </div>
</div>

<div class="modal" id="blockedModal">
 <div class="modal-box">
  <div class="modal-header">
   <h3>Blocked Accounts 🚫</h3>
   <button class="close-btn" id="closeBlockedModal">×</button>
  </div>
  <div class="users-list" id="blockedList"></div>
 </div>
</div>

<div id="chatScreen">
 <div class="chat-page">

  <div class="chat-header">
   <button class="back-btn" id="backChatBtn"><i class="fas fa-arrow-left"></i></button>
   <img id="chatUserPhoto" src="https://i.pravatar.cc/100">
   <div class="chat-header-info">
    <div class="chat-header-name" id="chatUserName">User</div>
    <div class="chat-header-status" id="chatUserStatus">🫣 Offline</div>
   </div>
   <button class="chat-more-btn" id="chatMoreBtn"><i class="fas fa-ellipsis-v"></i></button>
  </div>

  <div class="messages" id="messages"></div>
  <div class="typing-indicator" id="typingIndicator">🤔 Typing...</div>

  <div class="message-input-area">
   <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
   <button id="sendMessageBtn"><i class="fas fa-paper-plane"></i></button>
  </div>

 </div>
</div>

<div class="chat-action-menu" id="chatActionMenu">
 <div class="chat-action-box">
  <div class="chat-action-title" id="chatActionTitle">Chat options</div>
  <button class="chat-action delete" id="deleteChatBtn">🗑️ Delete Chat</button>
  <button class="chat-action block" id="blockUserBtn">🚫 Block User</button>
  <button class="chat-action cancel" id="closeChatActionMenu">Cancel</button>
 </div>
</div>

<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getAuth,
 GoogleAuthProvider,
 signInWithPopup,
 onAuthStateChanged,
 signOut,
 setPersistence,
 browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 setDoc,
 getDoc,
 deleteDoc,
 collection,
 query,
 where,
 getDocs,
 addDoc,
 onSnapshot,
 orderBy,
 serverTimestamp,
 updateDoc,
 increment
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={
 apiKey:"AIzaSyCzPOAjXI0dJ33RJCVIUyCCFGyeI50Dvd0",
 authDomain:"oii-chat-8802e.firebaseapp.com",
 projectId:"oii-chat-8802e",
 storageBucket:"oii-chat-8802e.firebasestorage.app",
 messagingSenderId:"1017345795063",
 appId:"1:1017345795063:web:7fc1dfedd027c4be0d84f2",
 measurementId:"G-304SPRZSPL"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const provider=new GoogleAuthProvider();


const $=id=>document.getElementById(id);

const loginScreen=$("loginScreen");
const appScreen=$("appScreen");
const chatScreen=$("chatScreen");
const googleLoginBtn=$("googleLoginBtn");
const logoutBtn=$("logoutBtn");
const loginError=$("loginError");
const userName=$("userName");
const userEmail=$("userEmail");
const userPhoto=$("userPhoto");
const myStoryPhoto=$("myStoryPhoto");
const newChatBtn=$("newChatBtn");
const usersModal=$("usersModal");
const usersList=$("usersList");
const blockedModal=$("blockedModal");
const blockedList=$("blockedList");
const chatList=$("chatList");
const backChatBtn=$("backChatBtn");
const chatUserPhoto=$("chatUserPhoto");
const chatUserName=$("chatUserName");
const chatUserStatus=$("chatUserStatus");
const messages=$("messages");
const messageInput=$("messageInput");
const sendMessageBtn=$("sendMessageBtn");
const unreadTabBadge=$("unreadTabBadge");
const typingIndicator=$("typingIndicator");
const chatMoreBtn=$("chatMoreBtn");
const chatActionMenu=$("chatActionMenu");
const deleteChatBtn=$("deleteChatBtn");
const blockUserBtn=$("blockUserBtn");
const closeChatActionMenu=$("closeChatActionMenu");
const chatActionTitle=$("chatActionTitle");


let currentUser=null;
let currentChatId=null;
let currentChatUser=null;
let unsubscribeMessages=null;
let unsubscribeChats=null;
let unsubscribeUserStatus=null;
let unsubscribeTyping=null;
let allChats=[];
let onlineTimer=null;
let typingTimer=null;

const ONLINE_TIMEOUT=60000;


function makeChatId(a,b){
 return [a,b].sort().join("_");
}

function escapeHTML(value){
 const d=document.createElement("div");
 d.textContent=value==null?"":String(value);
 return d.innerHTML;
}

function formatTime(timestamp){
 if(!timestamp)return "";
 const d=timestamp.toDate?timestamp.toDate():new Date(timestamp);
 return d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
}

function isUserOnline(user){
 if(!user||user.online!==true||!user.lastSeen)return false;
 const t=user.lastSeen.toMillis?user.lastSeen.toMillis():new Date(user.lastSeen).getTime();
 return Date.now()-t<ONLINE_TIMEOUT;
}


/* BLOCK CHECK */

async function isUserBlocked(uid){

 if(!auth.currentUser||!uid)return false;

 try{
  const snap=await getDoc(
   doc(db,"users",auth.currentUser.uid,"blocked",uid)
  );
  return snap.exists();
 }catch(e){
  console.error("Block check:",e);
  return false;
 }
}


/* LOGIN */

googleLoginBtn.addEventListener("click",async()=>{

 loginError.style.display="none";
 googleLoginBtn.disabled=true;
 googleLoginBtn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Signing in...';

 try{
  await signInWithPopup(auth,provider);
 }catch(error){
  console.error(error);
  loginError.style.display="block";
  loginError.textContent="Login failed: "+error.message;
  googleLoginBtn.disabled=false;
  googleLoginBtn.innerHTML='<i class="fab fa-google"></i> Continue with Google';
 }

});


/* USER PROFILE */

async function saveUserProfile(user){

 const ref=doc(db,"users",user.uid);
 const existing=await getDoc(ref);

 const data={
  uid:user.uid,
  name:user.displayName||"Oii User",
  email:user.email||"",
  photoURL:user.photoURL||"",
  online:true,
  lastSeen:serverTimestamp(),
  lastLogin:serverTimestamp()
 };

 if(!existing.exists())data.createdAt=serverTimestamp();

 await setDoc(ref,data,{merge:true});
}


/* ONLINE */

async function setUserOnline(){

 const user=auth.currentUser;
 if(!user)return;

 try{
  await setDoc(
   doc(db,"users",user.uid),
   {online:true,lastSeen:serverTimestamp()},
   {merge:true}
  );
 }catch(e){
  console.error("Online:",e);
 }
}

async function setUserOffline(){

 const user=auth.currentUser;
 if(!user)return;

 try{
  await setDoc(
   doc(db,"users",user.uid),
   {online:false,lastSeen:serverTimestamp()},
   {merge:true}
  );
 }catch(e){
  console.error("Offline:",e);
 }
}

function startOnlineHeartbeat(){

 stopOnlineHeartbeat();
 setUserOnline();

 onlineTimer=setInterval(()=>{
  if(auth.currentUser&&!document.hidden)setUserOnline();
 },20000);
}

function stopOnlineHeartbeat(){

 if(onlineTimer){
  clearInterval(onlineTimer);
  onlineTimer=null;
 }
}


/* TYPING */

async function setTyping(value){

 const user=auth.currentUser;

 if(!user||!currentChatId)return;

 try{
  await setDoc(
   doc(db,"chats",currentChatId,"typing",user.uid),
   {typing:value,updatedAt:serverTimestamp()},
   {merge:true}
  );
 }catch(e){
  console.error("Typing:",e);
 }
}

function startTypingListener(chatId){

 if(unsubscribeTyping){
  unsubscribeTyping();
  unsubscribeTyping=null;
 }

 if(!currentChatUser)return;

 unsubscribeTyping=onSnapshot(
  doc(db,"chats",chatId,"typing",currentChatUser.uid),
  snap=>{

   if(!snap.exists()){
    typingIndicator.style.display="none";
    return;
   }

   const d=snap.data();
   let typing=d.typing===true;

   if(d.updatedAt?.toMillis &&
      Date.now()-d.updatedAt.toMillis()>5000){
    typing=false;
   }

   typingIndicator.style.display=typing?"block":"none";

  },
  e=>console.error("Typing listener:",e)
 );
}


/* AUTH */

async function startApp(){

 try{
  await setPersistence(auth,browserLocalPersistence);
 }catch(e){
  console.error(e);
 }

 onAuthStateChanged(auth,async user=>{

  currentUser=user;

  if(user){

   loginScreen.style.display="none";
   appScreen.style.display="block";
   chatScreen.style.display="none";

   userName.textContent=user.displayName||"Oii User";
   userEmail.textContent=user.email||"";

   if(user.photoURL){
    userPhoto.src=user.photoURL;
    myStoryPhoto.src=user.photoURL;
   }

   try{
    await saveUserProfile(user);
    startOnlineHeartbeat();
    loadMyChats();
   }catch(e){
    console.error(e);
    chatList.innerHTML=
      `<div class="empty">Firebase error 😕<br><br>${escapeHTML(e.message)}</div>`;
   }

  }else{

   stopOnlineHeartbeat();
   loginScreen.style.display="flex";
   appScreen.style.display="none";
   chatScreen.style.display="none";

  }

 });

}

startApp();


document.addEventListener("visibilitychange",()=>{
 if(!auth.currentUser)return;
 if(document.hidden)setUserOffline();
 else setUserOnline();
});


/* LOAD CHATS */

function loadMyChats(){

 const user=auth.currentUser;

 if(!user)return;

 const q=query(
  collection(db,"chats"),
  where("participants","array-contains",user.uid)
 );

 if(unsubscribeChats)unsubscribeChats();

 unsubscribeChats=onSnapshot(q,async snapshot=>{

  allChats=[];

  for(const chatDoc of snapshot.docs){

   const data=chatDoc.data();

   if(data.deletedFor?.[user.uid]===true)continue;

   const otherUid=data.participants?.find(x=>x!==user.uid);

   if(!otherUid)continue;

   if(await isUserBlocked(otherUid))continue;

   try{

    const userSnap=await getDoc(doc(db,"users",otherUid));

    if(userSnap.exists()){

     allChats.push({
      id:chatDoc.id,
      user:userSnap.data(),
      lastMessage:data.lastMessage||"",
      updatedAt:data.updatedAt||null,
      unread:data.unread?.[user.uid]||0
     });

    }

   }catch(e){
    console.error(e);
   }
  }

  renderAllChats();

 },error=>{

  console.error(error);

  chatList.innerHTML=
   `<div class="empty">Unable to load chats 😕<br><br>${escapeHTML(error.message)}</div>`;

 });

}


/* RENDER CHATS */

function renderAllChats(){

 chatList.innerHTML="";

 const totalUnread=allChats.reduce((s,c)=>s+(c.unread||0),0);

 if(totalUnread){
  unreadTabBadge.style.display="inline-flex";
  unreadTabBadge.textContent=totalUnread>99?"99+":totalUnread;
 }else{
  unreadTabBadge.style.display="none";
 }

 const tab=document.querySelector(".tab.active")?.dataset.tab||"all";

 if(tab==="groups"){
  chatList.innerHTML='<div class="empty">Groups coming soon 👥🔥</div>';
  return;
 }

 if(tab==="channels"){
  chatList.innerHTML='<div class="empty">Channels coming soon 📢🔥</div>';
  return;
 }

 let chats=[...allChats];

 if(tab==="unread"){
  chats=chats.filter(c=>(c.unread||0)>0);
 }

 chats.sort((a,b)=>{
  const x=a.updatedAt?.toMillis?a.updatedAt.toMillis():0;
  const y=b.updatedAt?.toMillis?b.updatedAt.toMillis():0;
  return y-x;
 });

 if(!chats.length){
  chatList.innerHTML=
   `<div class="empty">${tab==="unread"?"😢 No unread messages":"No chats yet 💬<br><br>Tap + to start a new chat."}</div>`;
  return;
 }

 chats.forEach(renderChatCard);
}


function renderChatCard(chat){

 const div=document.createElement("div");
 div.className="chat-card";

 if(chat.unread>0)div.classList.add("has-unread");

 const photo=chat.user.photoURL||"https://i.pravatar.cc/100";
 const online=isUserOnline(chat.user);

 div.innerHTML=`
  <div class="avatar">
   <img src="${photo}">
   <span class="${online?"online-dot":"offline-dot"}"></span>
  </div>
  <div class="chat-info">
   <div class="chat-top">
    <span class="chat-name">${escapeHTML(chat.user.name||"Oii User")}</span>
    <span class="chat-time">${formatTime(chat.updatedAt)}</span>
   </div>
   <div class="chat-msg">${escapeHTML(chat.lastMessage||"Start chatting 💬")}</div>
  </div>
  ${chat.unread>0?`<div class="unread-count">${chat.unread>99?"99+":chat.unread}</div>`:""}
 `;

 div.onclick=()=>openChat(chat.id,chat.user);

 chatList.appendChild(div);
}


/* USERS */

async function loadUsers(){

 usersList.innerHTML='<div class="empty">Loading Oii Chat users... ⏳</div>';

 try{

  const snapshot=await getDocs(collection(db,"users"));
  usersList.innerHTML="";

  let count=0;

  snapshot.forEach(userDoc=>{

   const user=userDoc.data();

   if(!auth.currentUser||user.uid===auth.currentUser.uid)return;

   count++;

   const div=document.createElement("div");
   div.className="user-card";

   const photo=user.photoURL||"https://i.pravatar.cc/100";
   const online=isUserOnline(user);

   div.innerHTML=`
    <div style="position:relative">
     <img src="${photo}">
     <span class="${online?"online-dot":"offline-dot"}"></span>
    </div>
    <div class="user-card-info">
     <div class="user-card-name">${escapeHTML(user.name||"Oii User")}</div>
     <div class="user-card-email">${online?"👀 Online":"🫣 Offline"}</div>
    </div>
   `;

   div.onclick=()=>startPrivateChat(user);

   usersList.appendChild(div);
  });

  if(!count){
   usersList.innerHTML='<div class="empty">வேறு Oii Chat users இன்னும் இல்லை 💙</div>';
  }

 }catch(e){

  console.error(e);

  usersList.innerHTML=
   `<div class="empty">Users load ஆகவில்லை 😕<br><br>${escapeHTML(e.message)}</div>`;
 }
}


/* CREATE CHAT */

async function startPrivateChat(otherUser){

 const user=auth.currentUser;

 if(!user||!otherUser?.uid)return;

 if(await isUserBlocked(otherUser.uid)){
  alert("இந்த user-ஐ நீ block பண்ணியிருக்கிறாய் 🚫");
  return;
 }

 const chatId=makeChatId(user.uid,otherUser.uid);
 const chatRef=doc(db,"chats",chatId);

 try{

  const existing=await getDoc(chatRef);

  if(!existing.exists()){

   await setDoc(chatRef,{
    participants:[user.uid,otherUser.uid],
    createdAt:serverTimestamp(),
    updatedAt:serverTimestamp(),
    lastMessage:"",
    unread:{
     [user.uid]:0,
     [otherUser.uid]:0
    },
    deletedFor:{}
   });

  }else{

   await updateDoc(chatRef,{
    [`deletedFor.${user.uid}`]:false
   });

  }

  usersModal.style.display="none";
  openChat(chatId,otherUser);

 }catch(e){

  console.error(e);

  alert(
   "Chat create failed 😕\n\n"+
   (e.code||"")+
   "\n\n"+
   e.message
  );
 }
}


/* OPEN CHAT */

async function openChat(chatId,otherUser){

 const user=auth.currentUser;

 if(!user||!otherUser?.uid)return;

 currentChatId=chatId;
 currentChatUser={...otherUser,uid:otherUser.uid};

 chatUserName.textContent=otherUser.name||"Oii User";
 chatUserPhoto.src=otherUser.photoURL||"https://i.pravatar.cc/100";

 chatScreen.style.display="block";

 messages.innerHTML='<div class="empty">Loading messages... 💬</div>';
 messageInput.value="";
 typingIndicator.style.display="none";

 const blocked=await isUserBlocked(otherUser.uid);
 updateBlockUI(blocked);

 try{
  await updateDoc(
   doc(db,"chats",chatId),
   {[`unread.${user.uid}`]:0}
  );
 }catch(e){
  console.error("Unread:",e);
 }

 startTypingListener(chatId);

 if(unsubscribeUserStatus)unsubscribeUserStatus();

 unsubscribeUserStatus=onSnapshot(
  doc(db,"users",otherUser.uid),
  snap=>{

   if(!snap.exists())return;

   currentChatUser={
    ...snap.data(),
    uid:otherUser.uid
   };

   updateChatStatus(currentChatUser);

  }
 );

 if(unsubscribeMessages)unsubscribeMessages();

 const q=query(
  collection(db,"chats",chatId,"messages"),
  orderBy("createdAt","asc")
 );

 unsubscribeMessages=onSnapshot(
  q,
  snap=>{

   messages.innerHTML="";

   if(snap.empty){
    messages.innerHTML='<div class="empty">Say Hi 👋</div>';
    return;
   }

   snap.forEach(d=>renderMessage(d.data()));

   scrollMessages();

   if(!blocked)markMessagesRead(chatId);

  },
  e=>{

   console.error(e);

   messages.innerHTML=
    `<div class="empty">Messages load ஆகவில்லை 😕<br><br>${escapeHTML(e.message)}</div>`;
  }
 );

 updateChatStatus(currentChatUser);

 setTimeout(()=>messageInput.focus(),100);
}


function updateChatStatus(user){

 const online=isUserOnline(user);

 chatUserStatus.textContent=online?"👀 Online":"🫣 Offline";
 chatUserStatus.style.color=online?"#00ff66":"#888";
}


function updateBlockUI(blocked){

 messageInput.disabled=blocked;
 sendMessageBtn.disabled=blocked;
 messageInput.placeholder=blocked?"🚫 User blocked":"Type a message...";
}


/* READ */

async function markMessagesRead(chatId){

 const user=auth.currentUser;

 if(!user)return;

 try{

  const q=query(
   collection(db,"chats",chatId,"messages"),
   orderBy("createdAt","asc")
  );

  const snap=await getDocs(q);
  const updates=[];

  snap.forEach(d=>{

   const data=d.data();

   if(
    data.receiverId===user.uid &&
    (data.status==="sent"||data.status==="delivered")
   ){
    updates.push(
     updateDoc(d.ref,{status:"read"})
    );
   }

  });

  if(updates.length)await Promise.all(updates);

 }catch(e){
  console.error("Read:",e);
 }
}


/* MESSAGE RENDER */

function getMessageStatusIcon(status){

 if(status==="read")return "💞";
 if(status==="delivered")return "💓";
 return "🚀";
}


function renderMessage(data){

 const row=document.createElement("div");
 row.className="message-row";

 const user=auth.currentUser;
 const mine=user&&data.senderId===user.uid;

 if(mine)row.classList.add("mine");

 const bubble=document.createElement("div");
 bubble.className="message";

 const text=document.createElement("div");
 text.textContent=data.text||"";

 const meta=document.createElement("div");
 meta.className="message-meta";

 const time=document.createElement("span");
 time.className="message-time";
 time.textContent=formatTime(data.createdAt);

 meta.appendChild(time);

 if(mine){

  const status=document.createElement("span");
  status.className="message-status";
  status.textContent=getMessageStatusIcon(data.status);
  meta.appendChild(status);

 }

 bubble.appendChild(text);
 bubble.appendChild(meta);
 row.appendChild(bubble);
 messages.appendChild(row);
}


/* =========================
   SEND MESSAGE - FIXED
========================= */

async function sendMessage(){

 const text=messageInput.value.trim();

 if(!text)return;

 /*
   IMPORTANT:
   Firebase Auth-லிருந்து user-ஐ
   நேரடியாக இங்கே எடுக்கிறோம்.
   currentUser null ஆனாலும்
   uid error வராது.
 */

 const firebaseUser=auth.currentUser;

 if(!firebaseUser){

  alert(
   "Login session expired 😕\n\nPlease login again."
  );

  return;
 }

 if(
  !currentChatId||
  !currentChatUser||
  !currentChatUser.uid
 ){

  alert(
   "Chat is not ready 😕\n\nPlease open the chat again."
  );

  return;
 }

 /*
   await வருவதற்கு முன்னாடியே
   UID-களை save பண்ணுகிறோம்.
 */

 const senderUid=firebaseUser.uid;
 const receiverUid=currentChatUser.uid;
 const chatId=currentChatId;

 sendMessageBtn.disabled=true;

 try{

  /* OWN BLOCK CHECK */

  const blocked=await isUserBlocked(receiverUid);

  if(blocked){

   updateBlockUI(true);

   alert(
    "இந்த user-ஐ நீ block பண்ணியிருக்கிறாய் 🚫"
   );

   return;
  }


  /* CHECK CHAT */

  const chatRef=doc(db,"chats",chatId);
  const chatSnap=await getDoc(chatRef);

  if(!chatSnap.exists()){

   throw new Error(
    "Chat does not exist."
   );
  }


  const chatData=chatSnap.data();


  /* CHECK PARTICIPANTS */

  if(
   !Array.isArray(chatData.participants)||
   !chatData.participants.includes(senderUid)
  ){

   throw new Error(
    "You are not a participant."
   );
  }


  if(
   !chatData.participants.includes(receiverUid)
  ){

   throw new Error(
    "Receiver is not in this chat."
   );
  }


  /* STOP TYPING */

  await setTyping(false);


  /* CREATE MESSAGE */

  await addDoc(
   collection(
    db,
    "chats",
    chatId,
    "messages"
   ),
   {
    senderId:senderUid,
    receiverId:receiverUid,
    text:text,
    createdAt:serverTimestamp(),
    status:"sent"
   }
  );


  /* UPDATE CHAT */

  await updateDoc(
   chatRef,
   {
    lastMessage:text,
    updatedAt:serverTimestamp(),

    [`unread.${receiverUid}`]:
      increment(1),

    [`unread.${senderUid}`]:
      0,

    [`deletedFor.${senderUid}`]:
      false,

    [`deletedFor.${receiverUid}`]:
      false
   }
  );


  messageInput.value="";


 }catch(error){

  console.error(
   "SEND MESSAGE ERROR:",
   error
  );

  messageInput.value=text;

  alert(
   "Message send failed 😕\n\n"+
   (error.code||"unknown-error")+
   "\n\n"+
   error.message
  );


 }finally{

  /*
    currentChatUser null ஆனாலும்
    இங்கே error வராது.
  */

  let stillBlocked=false;

  if(
   auth.currentUser&&
   currentChatUser&&
   currentChatUser.uid
  ){

   stillBlocked=
    await isUserBlocked(
     currentChatUser.uid
    );
  }

  updateBlockUI(stillBlocked);

  if(
   auth.currentUser&&
   currentChatId
  ){
   messageInput.focus();
  }

 }

}


sendMessageBtn.addEventListener(
 "click",
 sendMessage
);


/* TYPING INPUT */

messageInput.addEventListener("input",()=>{

 if(!auth.currentUser||!currentChatId)return;

 setTyping(true);

 clearTimeout(typingTimer);

 typingTimer=setTimeout(()=>{
  setTyping(false);
 },1500);

});


messageInput.addEventListener("keydown",e=>{

 if(e.key==="Enter"){
  e.preventDefault();
  sendMessage();
 }

});


function scrollMessages(){
 messages.scrollTop=messages.scrollHeight;
}


/* NEW CHAT */

newChatBtn.onclick=()=>{
 usersModal.style.display="flex";
 loadUsers();
};

$("closeUsersModal").onclick=()=>{
 usersModal.style.display="none";
};


/* BLOCKED ACCOUNTS */

async function loadBlockedAccounts(){

 const user=auth.currentUser;

 if(!user)return;

 blockedList.innerHTML=
  '<div class="empty">Loading blocked accounts... ⏳</div>';

 try{

  const snap=await getDocs(
   collection(db,"users",user.uid,"blocked")
  );

  blockedList.innerHTML="";

  if(snap.empty){

   blockedList.innerHTML=
    '<div class="empty">Blocked accounts இல்லை 💙</div>';

   return;
  }

  snap.forEach(d=>{

   const data=d.data();

   const div=document.createElement("div");
   div.className="blocked-user";

   div.innerHTML=`
    <img src="${data.photoURL||"https://i.pravatar.cc/100"}">
    <div class="blocked-info">
     <div class="blocked-name">${escapeHTML(data.name||"Oii User")}</div>
     <div class="blocked-email">🚫 Blocked</div>
    </div>
    <button class="unblock-small">Unblock</button>
   `;

   div.querySelector("button").onclick=async()=>{
    await unblockFromHome(d.id);
   };

   blockedList.appendChild(div);
  });

 }catch(e){

  console.error(e);

  blockedList.innerHTML=
   `<div class="empty">Blocked accounts load ஆகவில்லை 😕<br><br>${escapeHTML(e.message)}</div>`;
 }
}


async function unblockFromHome(uid){

 const user=auth.currentUser;

 if(!user||!uid)return;

 try{

  await deleteDoc(
   doc(db,"users",user.uid,"blocked",uid)
  );

  alert("User unblocked 🔓");

  loadBlockedAccounts();
  loadMyChats();

 }catch(e){

  alert(
   "Unblock failed 😕\n\n"+e.message
  );
 }
}


/* BLOCK USER */

async function blockCurrentUser(){

 const user=auth.currentUser;

 if(!user||!currentChatUser)return;

 const name=currentChatUser.name||"இந்த user";

 if(!confirm(`${name}-ஐ block பண்ணலாமா? 🚫`))return;

 try{

  await setDoc(
   doc(
    db,
    "users",
    user.uid,
    "blocked",
    currentChatUser.uid
   ),
   {
    uid:currentChatUser.uid,
    name:currentChatUser.name||"Oii User",
    email:currentChatUser.email||"",
    photoURL:currentChatUser.photoURL||"",
    blockedAt:serverTimestamp()
   }
  );

  updateBlockUI(true);

  chatActionMenu.style.display="none";

  await setTyping(false);

  if(unsubscribeMessages){
   unsubscribeMessages();
   unsubscribeMessages=null;
  }

  if(unsubscribeUserStatus){
   unsubscribeUserStatus();
   unsubscribeUserStatus=null;
  }

  if(unsubscribeTyping){
   unsubscribeTyping();
   unsubscribeTyping=null;
  }

  chatScreen.style.display="none";

  currentChatId=null;
  currentChatUser=null;

  loadMyChats();

  alert("User blocked 🚫");

 }catch(e){

  console.error(e);

  alert(
   "Block failed 😕\n\n"+e.message
  );
 }
}


/* UNBLOCK */

async function unblockCurrentUser(){

 const user=auth.currentUser;

 if(!user||!currentChatUser)return;

 const name=currentChatUser.name||"இந்த user";

 if(!confirm(`${name}-ஐ unblock பண்ணலாமா? 🔓`))return;

 try{

  await deleteDoc(

    db,
    "users",
    user.uid,
    "blocked",
    currentChatUser.uid
   )
  );

  updateBlockUI(false);

  chatActionMenu.style.display="none";

  alert("User unblocked 🔓");

  loadMyChats();

 }catch(e){

  alert(
   "Unblock failed 😕\n\n"+e.message
  );
 }
}

/* DELETE CHAT */

deleteChatBtn.onclick=async()=>{

 if(!user||!currentChatId)return;

 if(!confirm(`${name}-உடன் chat-ஐ delete பண்ணலாமா? 🗑️`))return;

 try{

  await updateDoc(
   doc(db,"chats",currentChatId),
   {
    [`deletedFor.${user.uid}`]:true,
    [`unread.${user.uid}`]:0
   }
  );

  await setTyping(false);

  chatActionMenu.style.display="none";
  chatScreen.style.display="none";

  if(unsubscribeMessages){
   unsubscribeMessages();
   unsubscribeMessages=null;
  }

  if(unsubscribeUserStatus){
   unsubscribeUserStatus();
   unsubscribeUserStatus=null;
  }

  if(unsubscribeTyping){
   unsubscribeTyping();
   unsubscribeTyping=null;
  }

  currentChatId=null;
  currentChatUser=null;

  loadMyChats();

 }catch(e){

  alert(

  );
 }
};
