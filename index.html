<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Oii Chat 💬</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#050515;
  color:white;
  min-height:100vh;
}

button{
  font-family:inherit;
}

#loginScreen{
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top,rgba(0,212,255,.18),transparent 35%),
    radial-gradient(circle at bottom,rgba(255,0,127,.15),transparent 35%),
    #050515;
}

.login-box{
  width:100%;
  max-width:380px;
  padding:35px 25px;
  text-align:center;
  background:rgba(15,15,45,.88);
  border:1px solid rgba(0,212,255,.25);
  border-radius:25px;
  box-shadow:0 0 35px rgba(0,212,255,.12);
  backdrop-filter:blur(15px);
}

.login-logo{
  width:80px;
  height:80px;
  margin:0 auto 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:22px;
  font-size:42px;
  background:linear-gradient(45deg,#00d4ff,#ff007f);
}

.login-title{
  font-size:30px;
  font-weight:700;
  background:linear-gradient(45deg,#00d4ff,#ff007f);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.login-subtitle{
  color:#aaa;
  font-size:14px;
  margin:8px 0 28px;
}

#googleLoginBtn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:white;
  color:#222;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}

#googleLoginBtn i{
  color:#4285F4;
  font-size:20px;
}

#loginError{
  display:none;
  margin-top:15px;
  color:#ff668f;
  font-size:12px;
}

#appScreen{
  display:none;
}

.app-container{
  width:100%;
  max-width:450px;
  min-height:100vh;
  margin:auto;
  background:#080820;
  position:relative;
  padding-bottom:80px;
  border-left:1px solid rgba(0,212,255,.2);
  border-right:1px solid rgba(0,212,255,.2);
}

.header{
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(10,10,35,.95);
  position:sticky;
  top:0;
  z-index:100;
}

.logo-text{
  font-size:20px;
  font-weight:700;
  background:linear-gradient(45deg,#00d4ff,#ff007f);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.header-icons{
  display:flex;
  gap:18px;
  color:#00d4ff;
  font-size:18px;
}

.header-icons i{
  cursor:pointer;
}

.user-profile{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 20px 8px;
}

.user-profile img{
  width:45px;
  height:45px;
  border-radius:50%;
  border:2px solid #00d4ff;
  object-fit:cover;
}

.user-details{
  flex:1;
  min-width:0;
}

.user-name{
  font-size:14px;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.user-email{
  margin-top:2px;
  font-size:10px;
  color:#777;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.logout-btn{
  background:rgba(255,0,127,.12);
  color:#ff4f9a;
  border:1px solid rgba(255,0,127,.25);
  border-radius:10px;
  padding:7px 10px;
  cursor:pointer;
  font-size:11px;
}

/* STORIES */

.stories-container{
  display:flex;
  gap:15px;
  padding:15px 20px;
  overflow-x:auto;
  scrollbar-width:none;
}

.stories-container::-webkit-scrollbar{
  display:none;
}

.story{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  font-size:12px;
  flex-shrink:0;
}

.story-avatar{
  width:60px;
  height:60px;
  padding:3px;
  border-radius:50%;
  background:linear-gradient(45deg,#00d4ff,#ff007f);
  position:relative;
}

.story-avatar img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #080820;
}

.add-story{
  position:absolute;
  bottom:0;
  right:0;
  width:18px;
  height:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#00d4ff;
  color:black;
  font-size:12px;
  font-weight:bold;
}

/* TABS */

.tabs{
  display:flex;
  gap:10px;
  padding:10px 20px;
  overflow-x:auto;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  padding:7px 16px;
  border-radius:20px;
  font-size:13px;
  white-space:nowrap;
  background:rgba(255,255,255,.05);
  color:#aaa;
  border:1px solid rgba(255,255,255,.1);
  cursor:pointer;
}

.tab.active{
  background:linear-gradient(45deg,#00d4ff,#ff007f);
  color:white;
  font-weight:600;
  border:none;
}

.unread-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:18px;
  height:18px;
  margin-left:5px;
  padding:0 5px;
  border-radius:10px;
  background:#ff3b81;
  color:white;
  font-size:10px;
  font-weight:700;
}

/* CHAT LIST */

.chat-list{
  padding:10px 20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.chat-card{
  display:flex;
  align-items:center;
  gap:15px;
  padding:12px;
  background:rgba(20,20,50,.6);
  border-radius:16px;
  border:1px solid rgba(0,212,255,.2);
  cursor:pointer;
}

.chat-card:hover{
  border-color:rgba(0,212,255,.5);
  transform:translateY(-1px);
}

.avatar{
  width:50px;
  height:50px;
  flex-shrink:0;
  border-radius:50%;
  border:2px solid #ff007f;
  position:relative;
}

.avatar img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
}

.online-dot,
.offline-dot{
  position:absolute;
  right:-1px;
  bottom:0;
  width:14px;
  height:14px;
  border-radius:50%;
  border:2px solid #080820;
}

.online-dot{
  background:#00ff66;
}

.offline-dot{
  background:#555;
}

.chat-info{
  flex:1;
  min-width:0;
}

.chat-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:4px;
}

.chat-name{
  font-weight:600;
  font-size:15px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chat-time{
  font-size:10px;
  color:#888;
  white-space:nowrap;
}

.chat-msg{
  font-size:13px;
  color:#aaa;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chat-card.has-unread .chat-msg{
  color:white;
  font-weight:600;
}

.unread-count{
  min-width:20px;
  height:20px;
  padding:0 6px;
  border-radius:50%;
  background:#ff007f;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:700;
}

.empty{
  text-align:center;
  color:#777;
  padding:40px 20px;
  font-size:13px;
}

/* FAB */

.fab{
  position:fixed;
  bottom:80px;
  right:max(20px,calc((100vw - 450px)/2 + 20px));
  width:55px;
  height:55px;
  border:none;
  border-radius:50%;
  background:linear-gradient(45deg,#00d4ff,#ff007f);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  box-shadow:0 0 15px rgba(0,212,255,.5);
  cursor:pointer;
  z-index:90;
}

/* NAV */

.nav{
  position:fixed;
  bottom:0;
  width:100%;
  max-width:450px;
  height:65px;
  background:rgba(10,10,35,.97);
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid rgba(255,255,255,.1);
  z-index:100;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-size:10px;
  color:#666;
  cursor:pointer;
}

.nav-item.active{
  color:#00d4ff;
}

.nav-item i{
  font-size:18px;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:500;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-box{
  width:100%;
  max-width:400px;
  max-height:80vh;
  overflow:hidden;
  background:#10102d;
  border:1px solid rgba(0,212,255,.25);
  border-radius:22px;
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 20px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.modal-header h3{
  font-size:18px;
}

.close-btn{
  background:none;
  border:none;
  color:#aaa;
  font-size:20px;
  cursor:pointer;
}

.users-list{
  padding:10px;
  max-height:60vh;
  overflow-y:auto;
}

.user-card{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border-radius:14px;
  cursor:pointer;
}

.user-card:hover{
  background:rgba(255,255,255,.06);
}

.user-card img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #00d4ff;
}

.user-card-info{
  flex:1;
  min-width:0;
}

.user-card-name{
  font-size:14px;
  font-weight:600;
}

.user-card-email{
  color:#777;
  font-size:10px;
}

/* CHAT */

#chatScreen{
  display:none;
  position:fixed;
  inset:0;
  background:#080820;
  z-index:300;
}

.chat-page{
  width:100%;
  max-width:450px;
  height:100%;
  margin:auto;
  display:flex;
  flex-direction:column;
  background:#080820;
}

.chat-header{
  height:65px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 15px;
  background:#0d0d2b;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.back-btn{
  width:35px;
  height:35px;
  border:none;
  background:none;
  color:white;
  font-size:20px;
  cursor:pointer;
}

.chat-header img{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
}

.chat-header-info{
  flex:1;
  min-width:0;
}

.chat-header-name{
  font-size:14px;
  font-weight:600;
}

.chat-header-status{
  color:#888;
  font-size:10px;
}

.chat-more-btn{
  width:38px;
  height:38px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.06);
  color:white;
  font-size:17px;
  cursor:pointer;
}

/* MESSAGES */

.messages{
  flex:1;
  overflow-y:auto;
  padding:20px 15px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.message-row{
  display:flex;
  width:100%;
}

.message-row.mine{
  justify-content:flex-end;
}

.message{
  max-width:75%;
  padding:9px 12px;
  border-radius:15px;
  font-size:13px;
  word-wrap:break-word;
  background:#1b1b42;
}

.message-row.mine .message{
  background:linear-gradient(45deg,#007ea0,#a90055);
}

.message-meta{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:4px;
  margin-top:3px;
}

.message-time{
  font-size:8px;
  color:rgba(255,255,255,.55);
}

.message-status{
  font-size:11px;
}

.typing-indicator{
  display:none;
  padding:4px 15px 7px;
  color:#00d4ff;
  font-size:10px;
  font-style:italic;
}

.message-input-area{
  display:flex;
  gap:8px;
  padding:10px;
  background:#0d0d2b;
  border-top:1px solid rgba(255,255,255,.08);
}

#messageInput{
  flex:1;
  min-width:0;
  border:1px solid rgba(0,212,255,.2);
  outline:none;
  border-radius:22px;
  padding:11px 15px;
  background:#151535;
  color:white;
  font-size:13px;
}

#messageInput::placeholder{
  color:#777;
}

#sendMessageBtn{
  width:45px;
  height:45px;
  flex-shrink:0;
  border:none;
  border-radius:50%;
  background:linear-gradient(45deg,#00d4ff,#ff007f);
  color:white;
  cursor:pointer;
}

#sendMessageBtn:disabled{
  opacity:.6;
}

/* MENU */

.chat-action-menu{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:700;
  align-items:flex-end;
  justify-content:center;
}

.chat-action-box{
  width:100%;
  max-width:450px;
  background:#10102d;
  border-radius:22px 22px 0 0;
  padding:10px 10px 20px;
  border-top:1px solid rgba(0,212,255,.25);
}

.chat-action-title{
  text-align:center;
  color:#777;
  font-size:11px;
  padding:10px;
}

.chat-action{
  width:100%;
  padding:15px;
  border:none;
  background:transparent;
  color:white;
  text-align:left;
  font-size:14px;
  border-radius:12px;
  cursor:pointer;
}

.chat-action.delete{
  color:#ff4f7b;
}

.chat-action.block{
  color:#ff6688;
}

.chat-action.unblock{
  color:#00ff99;
}

.chat-action.cancel{
  color:#00d4ff;
  text-align:center;
}

/* BLOCKED */

.blocked-notice{
  text-align:center;
  padding:15px;
  color:#ff6688;
  font-size:11px;
}

@media(max-width:450px){

  .app-container{
    border:none;
  }

  .nav{
    max-width:100%;
  }

  .fab{
    right:20px;
  }

}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

  <div class="login-box">

    <div class="login-logo">💬</div>

    <div class="login-title">
      Oii Chat
    </div>

    <div class="login-subtitle">
      Tamil First Chat App 💙
    </div>

    <button id="googleLoginBtn">
      <i class="fab fa-google"></i>
      Continue with Google
    </button>

    <div id="loginError"></div>

  </div>

</div>


<!-- APP -->

<div id="appScreen">

  <div class="app-container">

    <div class="header">

      <div class="logo-text">
        Oii Chat 💬
      </div>

      <div class="header-icons">

        <i class="fas fa-search" id="searchBtn"></i>

        <i class="fas fa-ellipsis-v" id="moreBtn"></i>

      </div>

    </div>


    <div class="user-profile">

      <img id="userPhoto"
           src="https://i.pravatar.cc/100">

      <div class="user-details">

        <div class="user-name" id="userName">
          Oii User
        </div>

        <div class="user-email" id="userEmail">
          Loading...
        </div>

      </div>

      <button class="logout-btn" id="logoutBtn">
        Logout
      </button>

    </div>


    <div class="stories-container">

      <div class="story">

        <div class="story-avatar">

          <img id="myStoryPhoto"
               src="https://i.pravatar.cc/100">

          <div class="add-story">+</div>

        </div>

        <span>My Story</span>

      </div>

    </div>


    <div class="tabs">

      <div class="tab active" data-tab="all">
        All Chats
      </div>

      <div class="tab" data-tab="unread">
        Unread
        <span id="unreadTabBadge"
              class="unread-badge"
              style="display:none">
          0
        </span>
      </div>

      <div class="tab" data-tab="groups">
        Groups
      </div>

      <div class="tab" data-tab="channels">
        Channels
      </div>

    </div>


    <div class="chat-list" id="chatList">

      <div class="empty">
        Loading chats... 💬
      </div>

    </div>


    <button class="fab" id="newChatBtn">
      <i class="fas fa-plus"></i>
    </button>


    <div class="nav">

      <div class="nav-item active">
        <i class="fas fa-comment-dots"></i>
        <span>Chats</span>
      </div>

      <div class="nav-item">
        <i class="fas fa-phone-alt"></i>
        <span>Calls</span>
      </div>

      <div class="nav-item">
        <i class="fas fa-circle-notch"></i>
        <span>Status</span>
      </div>

      <div class="nav-item">
        <i class="fas fa-users"></i>
        <span>Communities</span>
      </div>

      <div class="nav-item">
        <i class="fas fa-cog"></i>
        <span>Settings</span>
      </div>

    </div>

  </div>

</div>


<!-- USERS MODAL -->

<div class="modal" id="usersModal">

  <div class="modal-box">

    <div class="modal-header">

      <h3>New Chat 💬</h3>

      <button class="close-btn" id="closeUsersModal">
        ×
      </button>

    </div>

    <div class="users-list" id="usersList">

      <div class="empty">
        Loading Oii Chat users...
      </div>

    </div>

  </div>

</div>


<!-- CHAT -->

<div id="chatScreen">

  <div class="chat-page">

    <div class="chat-header">

      <button class="back-btn" id="backChatBtn">
        <i class="fas fa-arrow-left"></i>
      </button>

      <img id="chatUserPhoto"
           src="https://i.pravatar.cc/100">

      <div class="chat-header-info">

        <div class="chat-header-name"
             id="chatUserName">
          User
        </div>

        <div class="chat-header-status"
             id="chatUserStatus">
          🫣 Offline
        </div>

      </div>

      <button class="chat-more-btn" id="chatMoreBtn">
        <i class="fas fa-ellipsis-v"></i>
      </button>

    </div>


    <div class="messages" id="messages"></div>

    <div class="typing-indicator" id="typingIndicator">
      🤔 Typing...
    </div>


    <div class="message-input-area">

      <input type="text"
             id="messageInput"
             placeholder="Type a message..."
             autocomplete="off">

      <button id="sendMessageBtn">
        <i class="fas fa-paper-plane"></i>
      </button>

    </div>

  </div>

</div>


<!-- CHAT ACTION MENU -->

<div class="chat-action-menu" id="chatActionMenu">

  <div class="chat-action-box">

    <div class="chat-action-title"
         id="chatActionTitle">
      Chat options
    </div>

    <button class="chat-action delete"
            id="deleteChatBtn">
      🗑️ Delete Chat
    </button>

    <button class="chat-action block"
            id="blockUserBtn">
      🚫 Block User
    </button>

    <button class="chat-action cancel"
            id="closeChatActionMenu">
      Cancel
    </button>

  </div>

</div>


<!-- FIREBASE -->

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,

========================= */

  authDomain:
    "oii-chat-8802e.firebaseapp.com",

  projectId:
    "oii-chat-8802e",

  storageBucket:

  messagingSenderId:
    "1017345795063",

    "1:1017345795063:web:7fc1dfedd027c4be0d84f2",

  measurementId:
    "G-304SPRZSPL"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

/* =========================
   ELEMENTS

const loginScreen =
  document.getElementById("loginScreen");

/* =========================
   NOTIFICATION
========================= */

async function requestNotificationPermission(){

  if(
    !("Notification" in window) ||
    notificationPermissionRequested
  ){
    return;
  }

  notificationPermissionRequested = true;

  try{

    if(Notification.permission === "default"){
      await Notification.requestPermission();
    }

  }catch(error){

    console.log(
      "Notification permission:",
      error
    );

  }

}


function showNotification(
  title,
  body,
  photo=""
){

  if(
    !("Notification" in window) ||
    Notification.permission !== "granted"
  ){
    return;
  }

  if(
    currentChatId &&
    chatScreen.style.display === "block"
  ){
    return;
  }

  try{

    const notification =
      new Notification(
        "😅 " + title,
        {
          body:body,
          icon:
            photo ||
            "https://i.pravatar.cc/100"
        }
      );

    notification.onclick = ()=>{
      window.focus();
      notification.close();
    };

  }catch(error){

    console.log(
      "Notification error:",
      error
    );

  }

}


/* =========================
   CHAT ID
========================= */

function makeChatId(uid1,uid2){

  return [
    uid1,
    uid2
  ]
  .sort()
  .join("_");

}


/* =========================
   TIME
========================= */

function formatTime(timestamp){

  if(!timestamp)
    return "";

  const date =
    timestamp.toDate
      ? timestamp.toDate()
      : new Date(timestamp);

  return date.toLocaleTimeString(
    [],
    {
      hour:"numeric",
      minute:"2-digit"
    }
  );

}


/* =========================
   ONLINE
========================= */

function isUserOnline(user){

  if(!user)
    return false;

  if(user.online !== true)
    return false;

  if(!user.lastSeen)
    return false;

  const lastSeen =
    user.lastSeen.toMillis
      ? user.lastSeen.toMillis()
      : new Date(user.lastSeen).getTime();

  return (
    Date.now() -
    lastSeen <
    ONLINE_TIMEOUT
  );

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

  const div =
    document.createElement("div");

  div.textContent =
    value == null
      ? ""
      : String(value);

  return div.innerHTML;

}

async function saveUserProfile(user){

  const userRef =
    doc(
      db,
      "users",
      user.uid
    );

  const existing =
    await getDoc(userRef);

  const data = {

    uid:user.uid,

    name:
      user.displayName ||
      "Oii User",

    email:
      user.email ||
      "",

    photoURL:
      user.photoURL ||
      "",

    online:true,

    lastSeen:
      serverTimestamp(),

    lastLogin:
      serverTimestamp()

  };

  if(!existing.exists()){
    data.createdAt =
      serverTimestamp();
  }

  await setDoc(
    userRef,
    data,
    {merge:true}
  );

}

function startTypingListener(chatId){

  if(unsubscribeTyping){

    unsubscribeTyping();
    unsubscribeTyping = null;

  }

  if(!currentChatUser)
    return;

  unsubscribeTyping =
    onSnapshot(
      doc(
        db,
        "chats",
        chatId,
        "typing",
        currentChatUser.uid
      ),
      snapshot=>{

        if(!snapshot.exists()){

          typingIndicator.style.display =
            "none";

          return;

        }

        const data =
          snapshot.data();

        let typing =
          data.typing === true;

        if(
          data.updatedAt &&
          data.updatedAt.toMillis
        ){

          const age =
            Date.now() -
            data.updatedAt.toMillis();

          if(age > 5000){
            typing = false;
          }

        }

        typingIndicator.style.display =
          typing
            ? "block"
            : "none";

      },
      error=>{

        console.error(
          "Typing listener:",
          error
        );

      }
    );

}


/* =========================
   DELIVERY
========================= */

function startDeliveryListener(chatId){

  if(!currentUser)
    return;

  const messagesRef =
    collection(
      db,
      "chats",
      chatId,
      "messages"
    );

  const messagesQuery =
    query(
      messagesRef,
      orderBy(
        "createdAt",
        "asc"
      )
    );

  onSnapshot(
    messagesQuery,
    async snapshot=>{

      const updates = [];

      snapshot.docChanges()
        .forEach(
          change=>{

            if(change.type !== "added")
              return;

            const data =
              change.doc.data();

            if(
              data.receiverId !==
              currentUser.uid
            ){
              return;
            }

            if(data.status === "sent"){

              updates.push(
                updateDoc(
                  change.doc.ref,
                  {
                    status:"delivered"
                  }
                )
              );

            }

            if(
              data.senderId !==
              currentUser.uid
            ){

              getDoc(
                doc(
                  db,
                  "users",
                  data.senderId
                )
              )
              .then(
                userSnap=>{

                  const sender =
                    userSnap.exists()
                      ? userSnap.data()
                      : {};

                  showNotification(
                    sender.name ||
                    "New message",
                    data.text ||
                    "New message 💬",
                    sender.photoURL ||
                    ""
                  );

                }
              )
              .catch(()=>{});

            }

          }
        );

      if(updates.length){

        try{

          await Promise.all(
            updates
          );

        }catch(error){

          console.error(
            "Delivered:",
            error
          );

        }

      }

    },
    error=>{

      console.error(
        "Delivery listener:",
        error
      );

    }
  );

}


/* =========================
   READ
========================= */

async function markMessagesRead(chatId){

  if(!currentUser)
    return;

  try{

    const messagesRef =
      collection(
        db,
        "chats",
        chatId,
        "messages"
      );

    const q =
      query(
        messagesRef,
        orderBy(
          "createdAt",
          "asc"
        )
      );

    const snap =
      await getDocs(q);

    const updates = [];

    snap.forEach(
      messageDoc=>{

        const data =
          messageDoc.data();

        if(
          data.receiverId ===
          currentUser.uid &&
          (
            data.status === "sent" ||
            data.status === "delivered"
          )
        ){

          updates.push(
            updateDoc(
              messageDoc.ref,
              {
                status:"read"
              }
            )
          );

        }

      }
    );

    if(updates.length){
      await Promise.all(updates);
    }

  }catch(error){

    console.error(
      "Read:",
      error
    );

  }

}

/* =========================
   LOAD CHATS
========================= */

function loadMyChats(){

  if(!currentUser)
    return;

  const chatsRef =
    collection(
      db,
      "chats"
    );

  const chatsQuery =
    query(
      chatsRef,
      where(
        "participants",
        "array-contains",
        currentUser.uid
      )
    );

  if(unsubscribeChats)
    unsubscribeChats();

  unsubscribeChats =
    onSnapshot(
      chatsQuery,
      async snapshot=>{

        allChats = [];

        for(
          const chatDoc
          of snapshot.docs
        ){

          const data =
            chatDoc.data();

          if(
            data.deletedFor &&
            data.deletedFor[
              currentUser.uid
            ] === true
          ){
            continue;
          }

          const otherUid =
            data.participants.find(
              uid =>
                uid !==
                currentUser.uid
            );

          if(!otherUid)
            continue;

          const blocked =
            await isUserBlocked(
              otherUid
            );

          if(blocked)
            continue;

          try{

            const userSnap =
              await getDoc(
                doc(
                  db,
                  "users",
                  otherUid
                )
              );

            if(userSnap.exists()){

              const otherUser =
                userSnap.data();

              allChats.push({

                id:chatDoc.id,

                user:otherUser,

                lastMessage:
                  data.lastMessage ||
                  "",

                updatedAt:
                  data.updatedAt ||
                  null,

                unread:
                  data.unread?.[
                    currentUser.uid
                  ] || 0

              });

            }

          }catch(error){

            console.error(error);

          }

        }

        renderAllChats();

        allChats.forEach(
          chat=>{
            startDeliveryListener(
              chat.id
            );
          }
        );

      },
      error=>{

        console.error(error);

        chatList.innerHTML = `

          <div class="empty">

            Unable to load chats 😕<br><br>

            ${escapeHTML(error.message)}

          </div>

        `;

      }
    );

}


/* =========================
   RENDER CHATS
========================= */

function renderAllChats(){

  chatList.innerHTML = "";

  const totalUnread =
    allChats.reduce(
      (sum,chat)=>
        sum +
        (chat.unread || 0),
      0
    );

  if(totalUnread > 0){

    unreadTabBadge.style.display =
      "inline-flex";

    unreadTabBadge.textContent =
      totalUnread > 99
        ? "99+"
        : totalUnread;

  }else{

    unreadTabBadge.style.display =
      "none";

  }

  const activeTab =
    document
      .querySelector(".tab.active")
      ?.dataset.tab ||
    "all";

  let chats =
    [...allChats];

  if(activeTab === "unread"){

    chats =
      chats.filter(
        chat =>
          (chat.unread || 0) > 0
      );

  }

  if(
    activeTab === "groups" ||
    activeTab === "channels"
  ){
    return;
  }

  chats.sort(
    (a,b)=>{

      const aTime =
        a.updatedAt?.toMillis
          ? a.updatedAt.toMillis()
          : 0;

      const bTime =
        b.updatedAt?.toMillis
          ? b.updatedAt.toMillis()
          : 0;

      return bTime-aTime;

    }
  );

  if(chats.length === 0){

    chatList.innerHTML = `

      <div class="empty">

        ${
          activeTab === "unread"
            ? "😢 No unread messages"
            : "No chats yet 💬<br><br>Tap + to start a new chat."
        }

      </div>

    `;

    return;

  }

  chats.forEach(
    renderChatCard
  );

}


/* =========================
   CHAT CARD
========================= */

function renderChatCard(chat){

  const div =
    document.createElement("div");

  div.className =
    "chat-card";

  if(chat.unread > 0){
    div.classList.add(
      "has-unread"
    );
  }

  const photo =
    chat.user.photoURL ||
    "https://i.pravatar.cc/100";

  const online =
    isUserOnline(
      chat.user
    );

  div.innerHTML = `

    <div class="avatar">

      <img
        src="${photo}"
        alt="User"
      >

      <span class="${
        online
          ? "online-dot"
          : "offline-dot"
      }"></span>

    </div>

    <div class="chat-info">

      <div class="chat-top">

        <span class="chat-name">

          ${escapeHTML(
            chat.user.name ||
            "Oii User"
          )}

        </span>

        <span class="chat-time">

          ${formatTime(
            chat.updatedAt
          )}

        </span>

      </div>

      <div class="chat-msg">

        ${escapeHTML(
          chat.lastMessage ||
          "Start chatting 💬"
        )}

      </div>

    </div>

    ${
      chat.unread > 0
        ? `
          <div class="unread-count">

            ${
              chat.unread > 99
                ? "99+"
                : chat.unread
            }

          </div>
        `
        : ""
    }

  `;

  div.addEventListener(
    "click",
    ()=>{
      openChat(
        chat.id,
        chat.user
      );
    }
  );

  chatList.appendChild(
    div
  );

}

/* =========================
   CREATE CHAT
========================= */

async function startPrivateChat(otherUser){

  if(!currentUser)
    return;

  const blocked =
    await isUserBlocked(
      otherUser.uid
    );

  if(blocked){

    alert(
      "இந்த user-ஐ நீ block பண்ணியிருக்கிறாய் 🚫\n\nUnblock பண்ணின பிறகு chat செய்யலாம்."
    );

    return;

  }

  const chatId =
    makeChatId(
      currentUser.uid,
      otherUser.uid
    );

  const chatRef =
    doc(
      db,
      "chats",
      chatId
    );

  try{

    const existing =
      await getDoc(
        chatRef
      );

    if(!existing.exists()){

      await setDoc(
        chatRef,
        {

          participants:[
            currentUser.uid,
            otherUser.uid
          ],

          createdAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp(),

          lastMessage:"",

          unread:{
            [currentUser.uid]:0,
            [otherUser.uid]:0
          },

          deletedFor:{}

        }
      );

    }else{

      await updateDoc(
        chatRef,
        {
          [`deletedFor.${currentUser.uid}`]:
            false
        }
      );

    }

    usersModal.style.display =
      "none";

    openChat(
      chatId,
      otherUser
    );

  }catch(error){

    console.error(error);

    alert(
      "Chat create failed 😕\n\n" +
      error.message
    );

  }

}

/* =========================
   OPEN CHAT
========================= */

async function openChat(
  chatId,
  otherUser
){

  currentChatId =
    chatId;

  currentChatUser =
    otherUser;

  chatUserName.textContent =
    otherUser.name ||
    "Oii User";

  chatUserPhoto.src =
    otherUser.photoURL ||
    "https://i.pravatar.cc/100";

  updateChatStatus(
    otherUser
  );

  chatScreen.style.display =
    "block";

  messages.innerHTML = `

    <div class="empty">
      Loading messages... 💬
    </div>

  `;

  messageInput.value = "";

  typingIndicator.style.display =
    "none";


  const blocked =
    await isUserBlocked(
      otherUser.uid
    );

  updateBlockUI(
    blocked
  );


  try{

    await updateDoc(
      doc(
        db,
        "chats",
        chatId
      ),
      {
        [`unread.${currentUser.uid}`]:
          0
      }
    );

  }catch(error){

    console.error(
      "Unread clear:",
      error
    );

  }


  startTypingListener(
    chatId
  );


  if(unsubscribeUserStatus){

    unsubscribeUserStatus();

    unsubscribeUserStatus = null;

  }

  unsubscribeUserStatus =
    onSnapshot(
      doc(
        db,
        "users",
        otherUser.uid
      ),
      snapshot=>{

        if(!snapshot.exists())
          return;

        const freshUser =
          snapshot.data();

        currentChatUser = {

          ...freshUser,

          uid:
            otherUser.uid

        };

        updateChatStatus(
          currentChatUser
        );

      }
    );


  if(unsubscribeMessages){

    unsubscribeMessages();

    unsubscribeMessages = null;

  }

  const messagesRef =
    collection(
      db,
      "chats",
      chatId,
      "messages"
    );

  const messagesQuery =
    query(
      messagesRef,
      orderBy(
        "createdAt",
        "asc"
      )
    );

  unsubscribeMessages =
    onSnapshot(
      messagesQuery,
      snapshot=>{

        messages.innerHTML = "";

        if(snapshot.empty){

          messages.innerHTML = `

            <div class="empty">
              Say Hi 👋
            </div>

          `;

          return;

        }

        snapshot.forEach(
          messageDoc=>{

            renderMessage(
              messageDoc.data()
            );

          }
        );

        scrollMessages();

        if(!blocked){

          markMessagesRead(
            chatId
          );

        }

      },
      error=>{

        console.error(error);

        messages.innerHTML = `

          <div class="empty">

            Messages load ஆகவில்லை 😕<br><br>

            ${escapeHTML(
              error.message
            )}

          </div>

        `;

      }
    );


  setTimeout(
    ()=>{
      messageInput.focus();
    },
    100
  );

}


/* =========================

function updateBlockUI(blocked){

  if(blocked){

    messageInput.disabled = true;

    sendMessageBtn.disabled = true;

/* =========================
   STATUS ICON
========================= */

function getMessageStatusIcon(status){

  if(status === "read")
    return "💞";

  if(status === "delivered")
    return "💓";

  return "🚀";

}


/* =========================
   RENDER MESSAGE
========================= */

function renderMessage(data){

  const row =
    document.createElement("div");

  row.className =
    "message-row";

  const mine =
    currentUser &&
    data.senderId ===
    currentUser.uid;

  if(mine){

    row.classList.add("mine");

  }

  const bubble =
    document.createElement("div");

  bubble.className =
    "message";

  const text =
    document.createElement("div");

  text.textContent =
    data.text || "";

  const meta =
    document.createElement("div");

  meta.className =
    "message-meta";

  const time =
    document.createElement("span");

  time.className =
    "message-time";

  time.textContent =
    formatTime(
      data.createdAt
    );

  meta.appendChild(time);

  if(mine){

    const status =
      document.createElement("span");

    status.className =
      "message-status";

    status.textContent =
      getMessageStatusIcon(
        data.status
      );

    meta.appendChild(status);

  }

  bubble.appendChild(text);

  bubble.appendChild(meta);

  row.appendChild(bubble);

  messages.appendChild(row);

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  const text =
    messageInput.value.trim();

  if(
    !text ||
    !currentUser ||
    !currentChatId ||
    !currentChatUser
  ){
    return;
  }


  sendMessageBtn.disabled = true;


  try{

    /* =========================
       BLOCK CHECK
    ========================= */

    const blocked =
      await isUserBlocked(
        currentChatUser.uid
      );

    if(blocked){

      alert(
        "இந்த user-ஐ நீ block பண்ணியிருக்கிறாய் 🚫"
      );

      updateBlockUI(true);

      return;

    }


    /* =========================
       CHAT REF
    ========================= */

    const chatRef =
      doc(
        db,
        "chats",
        currentChatId
      );

    const chatSnap =
      await getDoc(
        chatRef
      );

    if(!chatSnap.exists()){

      throw new Error(
        "Chat does not exist."
      );

    }

    const chatData =
      chatSnap.data();


    /* =========================
       PARTICIPANT CHECK
    ========================= */

    if(
      !Array.isArray(
        chatData.participants
      ) ||
      !chatData.participants.includes(
        currentUser.uid
      )
    ){

      throw new Error(
        "You are not a participant."
      );

    }


    if(
      !chatData.participants.includes(
        currentChatUser.uid
      )
    ){

      throw new Error(
        "Receiver is not in this chat."
      );

    }


    /* =========================
       RECEIVER BLOCK CHECK
    ========================= */

    const receiverBlocked =
      await getDoc(
        doc(
          db,
          "users",
          currentChatUser.uid,
          "blocked",
          currentUser.uid
        )
      );

    if(receiverBlocked.exists()){

      throw new Error(
        "இந்த user உங்களை block பண்ணியிருக்கிறார் 🚫"
      );

    }


    /* =========================
       STOP TYPING
    ========================= */

    await setTyping(false);


    /* =========================
       SEND MESSAGE
    ========================= */

    const messageRef =
      await addDoc(
        collection(
          db,
          "chats",
          currentChatId,
          "messages"
        ),
        {

          senderId:
            currentUser.uid,

          receiverId:
            currentChatUser.uid,

          text:
            text,

          createdAt:
            serverTimestamp(),

          status:
            "sent"

        }
      );


    console.log(
      "Message sent:",
      messageRef.id
    );


    /* =========================
       UPDATE CHAT
    ========================= */

    await updateDoc(
      chatRef,
      {

        lastMessage:
          text,

        updatedAt:
          serverTimestamp(),

        [`unread.${currentChatUser.uid}`]:
          increment(1),

        [`unread.${currentUser.uid}`]:
          0,

        [`deletedFor.${currentUser.uid}`]:
          false,

        [`deletedFor.${currentChatUser.uid}`]:
          false

      }
    );


    /* =========================
       CLEAR INPUT
    ========================= */

    messageInput.value = "";


  }catch(error){

    console.error(
      "SEND MESSAGE ERROR:",
      error
    );

    messageInput.value =
      text;

    alert(
      "Message send failed 😕\n\n" +
      error.code +
      "\n\n" +
      error.message
    );

  }finally{

    const stillBlocked =
      currentChatUser
        ? await isUserBlocked(
            currentChatUser.uid
          )
        : false;

    updateBlockUI(
      stillBlocked
    );

    if(!stillBlocked){

      sendMessageBtn.disabled =
        false;

    }

    messageInput.focus();

  }

}

/* =========================

========================= */

async function deleteCurrentChat(){

  if(
    !currentUser ||
    !currentChatId
  ){
    return;
  }

  const name =
    currentChatUser?.name ||
    "இந்த user";

  const ok =
    confirm(
      `${name}-உடன் chat-ஐ delete பண்ணலாமா? 🗑️\n\nஉன் Chat list-லிருந்து மட்டும் இது மறையும்.`
    );

  if(!ok)
    return;

  try{

    await updateDoc(
      doc(
        db,
        "chats",
        currentChatId
      ),
      {
        [`deletedFor.${currentUser.uid}`]:
          true,

        [`unread.${currentUser.uid}`]:
          0
      }
    );


    chatActionMenu.style.display =
      "none";

    await setTyping(false);


    if(unsubscribeMessages){

      unsubscribeMessages();

      unsubscribeMessages = null;

    }

    if(unsubscribeUserStatus){

      unsubscribeUserStatus();

      unsubscribeUserStatus = null;

    }

    if(unsubscribeTyping){

      unsubscribeTyping();

      unsubscribeTyping = null;

    }


    chatScreen.style.display =
      "none";

    currentChatId = null;

    currentChatUser = null;

    loadMyChats();

  }catch(error){

    console.error(
      "Delete chat:",
      error
    );

    alert(
      "Chat delete failed 😕\n\n" +
      error.message
    );

  }

}

      doc(

        "blocked",

      {

    );

    );

}

    confirm(
      `${name}-ஐ unblock பண்ணலாமா? 🔓`

  try{

    await deleteDoc(

      error.message
    );

  }

}
